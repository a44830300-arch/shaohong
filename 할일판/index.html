<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>샤오홍슈 작업목록</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 할 일판 1 = 샤오홍슈 작업목록 전용. 2026-11-24 두 번째 정리 요청:
   🟢 지금 하고 있는 일(비움) → 📅 이번 주 고정 콘텐츠(날씨달력·축제달력) → 🧭 행동강령 → 🗂️ 컨셉별 게시물.
   기능은 작업 타이머만 남김(스톱워치·한눈에 숫자·게시물 후보 고르기·진행 중 게시물·날짜 없는 일·막대 일정표 뺌). */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --line: #dfe3de; --fg: #1f2622; --muted: #66706a;
  --accent: #e8731c; --accent-soft: #fdeedf; --red: #d33a2c;
  --blue: #3b6fd8; --blue-soft: #e6eefc; --green: #3f8f3a; --green-soft: #e1f2dc;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a17; --surface: #1d2420; --line: #2f3833; --fg: #e9eee9; --muted: #9aa59e;
  --accent: #f28a3a; --accent-soft: #3a2a1c; --red: #ff6f61;
  --blue: #7aa2f7; --blue-soft: #1f2a40; --green: #7cc576; --green-soft: #1f3320; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a17; --surface: #1d2420; --line: #2f3833; --fg: #e9eee9; --muted: #9aa59e;
  --accent: #f28a3a; --accent-soft: #3a2a1c; --red: #ff6f61;
  --blue: #7aa2f7; --blue-soft: #1f2a40; --green: #7cc576; --green-soft: #1f3320; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; gap: 28px; }
.wrap > section { min-width: 0; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 26px; font-weight: 700; }
h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
h2 { margin: 0 0 10px; font-size: 17px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
h2 .sub { font-size: 12px; font-weight: 500; color: var(--muted); }
button { font: inherit; cursor: pointer; touch-action: manipulation; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) { .btn:hover { border-color: var(--accent); } }
.status { font-size: 12px; color: var(--muted); }

/* 작업 타이머 */
.timer { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 8px; }
.timer::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--p, 0) * 100%); background: var(--accent); }
.t-time { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 22px; min-width: 7ch; text-align: center; }
.t-go { min-width: 60px; }
.t-presets { display: flex; flex-wrap: wrap; gap: 4px; }
.t-presets button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 3px 9px; font-size: 12px; }
.t-presets button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.timer.ring .t-time { color: var(--red); }
@media (prefers-reduced-motion: no-preference) { .timer.ring .t-time { animation: tblink 1s steps(2) infinite; } }
@keyframes tblink { 50% { opacity: .2; } }

/* 목록 */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; gap: 2px; padding: 10px 14px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .title { font-weight: 500; overflow-wrap: anywhere; }
.row .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 18px 14px; font-size: 14px; }

/* 이번 주 고정 콘텐츠 */
.fixed { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.fx { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.fx b { font-size: 16px; }
.fx b span { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.fx ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.fx li { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.fx li .d { font-family: var(--font-num); font-size: 13px; color: var(--muted); min-width: 7.5em; }
.fx li.today .d, .fx li.today { color: var(--accent); font-weight: 600; }
.fx li.past { color: var(--muted); text-decoration: line-through; }

/* 행동강령 */
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; padding: 12px 14px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.steps li { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.steps li .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--font-num); font-size: 12px; }
.steps li + li::before { content: "→"; color: var(--muted); font-weight: 400; margin-right: 2px; }

/* 컨셉별 게시물 카드 */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.cd { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cd-h { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.cd-h b { font-size: 15px; }
.cd-h .info { font-size: 12px; color: var(--muted); }
.cd .row { padding: 8px 14px; }
.cd .row .title { font-size: 14px; }
.acc { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 7px; margin-right: 6px; vertical-align: 1px; }
.acc.n { color: var(--green); background: var(--green-soft); }
.acc.j { color: var(--blue); background: var(--blue-soft); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }

/* ---------- 휴대폰 ---------- */
@media (max-width: 760px) {
  body { font-size: 16px; }
  .wrap { padding-block: 0 56px; gap: 22px; }
  header { position: sticky; top: 0; z-index: 9; background: var(--bg); padding-block: max(8px, env(safe-area-inset-top, 0px)) 8px; align-items: center; row-gap: 6px; column-gap: 8px; box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(0 -100vmax); border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; line-height: 1.2; }
  h1 small { display: inline; font-size: 11px; margin-right: 6px; }
  header .status { display: none; }
  header .btn { padding: 4px 10px; font-size: 12px; }
  .timer { order: 3; flex: 1 1 100%; flex-wrap: nowrap; gap: 5px; padding: 3px 6px 5px; border-radius: 10px; }
  .t-time { font-size: 18px; min-width: 6ch; }
  .t-go { min-width: 46px; flex: none; }
  .t-presets { flex: 1 1 0; min-width: 0; flex-wrap: nowrap; overflow-x: auto; }
  .t-presets button { flex: none; padding: 3px 8px; font-size: 11px; }
  .timer.running .t-presets { display: none; }
  h2 { font-size: 18px; }
  .row .meta { font-size: 13px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small id="today-label">오늘</small>샤오홍슈 작업목록</h1>
    <div class="timer" id="timer" role="group" aria-label="작업 타이머">
      <span class="t-time" id="t-time">40:00</span>
      <button class="btn primary t-go" id="t-go" type="button">시작</button>
      <button class="btn" id="t-reset" type="button" aria-label="처음으로">↺</button>
      <div class="t-presets" id="t-presets">
        <button type="button" data-min="10">10분</button>
        <button type="button" data-min="40">40분</button>
        <button type="button" data-min="60">1시간</button>
        <button type="button" data-min="80">1시간 20분</button>
        <button type="button" data-min="120">2시간</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status">불러오는 중…</span>
      <button class="btn" id="refresh" type="button">새로고침</button>
    </div>
  </header>

  <section id="sec-doing">
    <h2>🟢 지금 하고 있는 일</h2>
    <div class="list"><div class="empty">비어 있어요.</div></div>
  </section>

  <section id="sec-week">
    <h2>📅 이번 주 <span class="sub">매주 올리는 고정 콘텐츠</span></h2>
    <div class="fixed" id="fixed"></div>
  </section>

  <section id="sec-rule">
    <h2>🧭 행동강령 <span class="sub">게시물 하나를 만들 때 이 순서로</span></h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section id="sec-posts">
    <h2>🗂️ 게시물 <span class="sub">컨셉별로 나눔 · Todoist "샤오홍슈 아이디어" 칸 · 초록 = 나들로그 · 파랑 = 제주라이브</span></h2>
    <div class="cards" id="cards"><div class="list"><div class="empty">불러오는 중…</div></div></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const TD = "Todoist";
const IDEA_SECTION = "6hqfQg4Q9MMprpjc";  // 💼 일 > 샤오홍슈 아이디어
const WD = ["일","월","화","수","목","금","토"];
let mcp = null;
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mdw = (d) => `${d.getMonth() + 1}/${d.getDate()} (${WD[d.getDay()]})`;
let toastTimer = null;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 6000); }

// ---------- 📅 이번 주 고정 콘텐츠 (월~일 기준 이번 주의 토·일) ----------
// 지금은 날씨달력·축제달력 두 가지. 고정 콘텐츠가 늘면 여기에 더한다
const FIXED = [
  { name: "🌤️ 날씨달력", acc: "나들로그", steps: [[6, "", "만들기 (토요일 2시간 30분 안에서)"], [0, "10:00", "올리기"]] },
  { name: "🎉 축제달력", acc: "나들로그", steps: [[6, "", "만들기 (토요일 2시간 30분 안에서)"], [0, "20:00", "올리기"]] },
];
function renderFixed() {
  const now = new Date(), today = ymd(now);
  const monday = addDays(now, -((now.getDay() + 6) % 7));
  const dayOf = (wd) => addDays(monday, (wd + 6) % 7);
  $("today-label").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일`;
  $("fixed").replaceChildren(...FIXED.map((f) => h("div", { class: "fx" },
    h("b", null, f.name, h("span", null, f.acc)),
    h("ul", null, f.steps.map(([wd, tm, what]) => {
      const d = dayOf(wd), k = ymd(d);
      return h("li", { class: k === today ? "today" : k < today ? "past" : null }, h("span", { class: "d" }, `${mdw(d)}${tm ? " " + tm : ""}`), what);
    })))));
}

// ---------- 🧭 행동강령 (체크리스트 아님) ----------
const STEPS = ["기획안 짜기", "레퍼런스 찾기", "작업하기", "마무리", "캡션 짜기"];
$("steps").append(...STEPS.map((s, i) => h("li", null, h("span", { class: "n" }, i + 1), s)));

// ---------- 🗂️ 컨셉별 게시물 ----------
// 컨셉 나눔은 크리링이 정함(2026-11-24). 새 아이디어는 이름 낱말로 짐작하고, 안 맞으면 "아직 안 나눈 것"
const CONCEPTS = [
  ["🌸 계절·제철", "그 계절에만 볼 수 있는 꽃·풍경"],
  ["🌦️ 날씨", "날씨·옷차림과 이어지는 글"],
  ["🎉 축제·연휴", "날짜가 정해진 축제·공연·연휴"],
  ["📍 장소 완전정리", "한 동네·한 장소를 깊게 정리"],
  ["🧾 내돈내산·가게", "직접 돈 내고 다녀온 가게 후기"],
  ["🆘 여행 중 막힐 때", "분실물·예약·교통·병원처럼 막히는 순간"],
  ["🎬 영상·특별 기획", "영상·시리즈·참여형 기획"],
  ["📝 메모·준비", "게시물이 아니라 규칙·준비 작업"],
  ["🆕 아직 안 나눈 것", "새로 들어온 아이디어"],
];
const CONCEPT_OF = {
  "6hqrXmF6Xqm9GHrc": 0, "6j34fQR54P2JMhP6": 0, "6hqrXmPGCcMvMxc6": 0, "6hqrXmGVhM2mx4W6": 0, "6hpFh9RWP5w26WH7": 0, "6hpFh9JHp5h9WG67": 0,
  "6j3j5vRj8Hpjf5Vc": 1,
  "6j34cRH7Q4xGXXhc": 2, "6hqrXmCRFQr5hqc6": 2, "6j34fQRfVvfC5Fpc": 2, "6hqrXmHc6r4MHwjc": 2, "6hqrcggvVJrPQh9c": 2, "6hqrXmMmGVpF7Wv6": 2, "6hqrcghCxwCrxg36": 2,
  "6hhV346g43FR9rrf": 3, "6hhV35P8m9VJ2VPf": 3, "6hhV376pxVwXRjPf": 3, "6hhV33JRwmjRfPVf": 3, "6hhRm4XhvjhM3gvf": 3, "6hmPF8fmM65964pf": 3, "6hmPF9cxmMxxRfwf": 3, "6hmPVMfvgc45j2Vf": 3, "6j3p8mqqx5Jvf4Fc": 3, "6hrHMv2HjH283prc": 3,
  "6j34Qwwqv7CvWMC6": 4, "6hqrWxrFGc52x37c": 4,
  "6j34Qwx4HjQqF826": 5, "6j34Qwx5VxVcHwFc": 5, "6j34Qx2f5QJ6q5W6": 5, "6j37Pgh8JJ2gCjm6": 5, "6j389pcq2PC3wF7c": 5, "6j389pf7Rr6Rf846": 5, "6j389ph3xx726CFc": 5, "6j34fQRf6QvF6pw6": 5, "6j34fQQg74Wg6Gxc": 5, "6j34fQRGhHM8Qpx6": 5, "6hhRm2C2QXv4f5Ff": 5, "6hhRjxhvv6XCCRff": 5, "6hhV332h2W82RGpf": 5,
  "6hwjFrrMpjQF7fm6": 6, "6j34QwqrJ6JJPQ6c": 6, "6hpFW4PJ94GGXq7f": 6, "6hrWjwv8rXgv7wW6": 6,
  "6hwCGjjg25HxvMwc": 7, "6hwCGxC9Mp38j7W6": 7, "6hpCjPcW87PQwHMf": 7, "6hpCjR3hjWw8Gxv7": 7, "6hmPc6qf3rGh8Q5f": 7,
};
const GUESS = [[/동백|유채|매화|꽃|눈꽃|단풍|억새|계절|제철/, 0], [/날씨|옷차림|코디|비|바람/, 1], [/축제|연말|크리스마스|새해|춘절|연휴|공연/, 2], [/잃어버|분실|막히|예약|택시|병원|공항 도착/, 5], [/내돈내산|탐방|맛집|카페 후기/, 4], [/완전정리|총정리|관광지|스팟/, 3], [/영상|AI|시리즈/, 6]];
const conceptOf = (t) => CONCEPT_OF[t.id] ?? GUESS.find(([re]) => re.test(t.content))?.[1] ?? 8;
const accOf = (t, headName) => (/^🆘|제주라이브/.test(t.content) || /제주라이브/.test(headName) ? "j" : /^🗿|나들로그/.test(t.content) || /나들로그/.test(headName) ? "n" : null);
const cleanName = (t) => t.content.replace(/^\S+\s*(나들로그|제주라이브)\s*:\s*/, "").replace(/\s*\((?:\d+시간)?\s*(?:\d+분)?\)\s*$/, "");

async function findAll(args) {
  const out = []; let cursor = null;
  for (let i = 0; i < 20; i++) {
    const p = (await mcp.callTool(TD, "find-tasks", { ...args, limit: 100, ...(cursor ? { cursor } : {}) }, { cache: false })).payload || {};
    out.push(...(p.tasks || []));
    cursor = p.nextCursor || null;
    if (!cursor || p.hasMore === false) break;
  }
  return out;
}
function renderCards(items) {
  const groups = CONCEPTS.map(() => []);
  for (const it of items) groups[conceptOf(it.t)].push(it);
  const cards = [];
  groups.forEach((list, i) => {
    if (!list.length) return;
    list.sort((a, b) => (a.acc || "z").localeCompare(b.acc || "z") || cleanName(a.t).localeCompare(cleanName(b.t), "ko"));
    const [name, info] = CONCEPTS[i];
    const card = h("div", { class: "cd" }, h("div", { class: "cd-h" }, h("b", null, `${name} · ${list.length}개`), h("div", { class: "info" }, info)));
    for (const { t, acc } of list) {
      const desc = (t.description || "").split("\n")[0].replace(/^왜:\s*/, "");
      card.append(h("div", { class: "row" },
        h("div", { class: "title" }, acc ? h("span", { class: "acc " + acc }, acc === "n" ? "나들로그" : "제주라이브") : null, cleanName(t)),
        desc ? h("div", { class: "meta" }, desc) : null));
    }
    cards.push(card);
  });
  $("cards").replaceChildren(...(cards.length ? cards : [h("div", { class: "list" }, h("div", { class: "empty" }, "아이디어 칸이 비어 있어요."))]));
}
async function load() {
  renderFixed();
  $("status").textContent = "불러오는 중…"; $("refresh").textContent = "불러오는 중…";
  try {
    const all = await findAll({ sectionId: IDEA_SECTION });
    // 머리 할 일 「📋 ○○ 게시물 후보」는 묶음일 뿐이라 빼고, 그 밑 할 일은 계정을 이어받음. ①②③ 단계는 보여 주지 않음
    const heads = new Map(all.filter((t) => !t.parentId && /게시물 후보/.test(t.content)).map((t) => [t.id, t.content]));
    const items = all.filter((t) => (!t.parentId && !heads.has(t.id)) || heads.has(t.parentId)).map((t) => ({ t, acc: accOf(t, heads.get(t.parentId) || "") }));
    renderCards(items);
    const n = new Date();
    $("status").textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}에 불러옴`;
  } catch (err) {
    $("cards").replaceChildren(h("div", { class: "list" }, h("div", { class: "empty" }, "Todoist를 불러오지 못했어요. 새로고침해 보세요.")));
    $("status").textContent = "불러오지 못했어요";
  }
  $("refresh").textContent = "새로고침";
}

// ---------- 작업 타이머 (이 기기에만 기억 · 끝나면 소리·진동) ----------
const TKEY = "board-timer";
const timer = { total: 40 * 60000, left: 40 * 60000, endAt: 0, run: false };
let tTick = null, audioCtx = null;
try { Object.assign(timer, JSON.parse(localStorage.getItem(TKEY)) || {}); } catch {}
const tSave = () => { try { localStorage.setItem(TKEY, JSON.stringify(timer)); } catch {} };
const tLeft = () => (timer.run ? Math.max(0, timer.endAt - Date.now()) : timer.left);
function tFmt(ms) {
  const s = Math.ceil(ms / 1000), hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  return hh ? `${hh}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`;
}
function tLabel(ms) {
  const m = Math.round(ms / 60000), hh = Math.floor(m / 60), mm = m % 60;
  return [hh ? `${hh}시간` : "", mm ? `${mm}분` : ""].filter(Boolean).join(" ");
}
function tDraw() {
  const left = tLeft();
  $("t-time").textContent = tFmt(left);
  $("t-go").textContent = timer.run ? "멈춤" : left > 0 && left < timer.total ? "계속" : "시작";
  $("timer").style.setProperty("--p", 1 - left / timer.total);
  $("timer").classList.toggle("running", timer.run);
  for (const b of $("t-presets").children) b.setAttribute("aria-pressed", String(Number(b.dataset.min) * 60000 === timer.total));
  if (timer.run && left <= 0) tDone();
}
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), at = t0 + i * 0.5;
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.3, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
      o.start(at); o.stop(at + 0.4);
    }
  } catch {}
}
function tStopTick() { clearInterval(tTick); tTick = null; }
function tDone() {
  timer.run = false; timer.left = 0; tSave(); tStopTick();
  $("timer").classList.add("ring");
  beep();
  try { navigator.vibrate?.([400, 200, 400, 200, 400]); } catch {}
  toast(`⏰ ${tLabel(timer.total)} 끝났어요! 잠깐 쉬어 가요`);
  tDraw();
}
$("t-go").addEventListener("click", () => {
  $("timer").classList.remove("ring");
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  if (timer.run) { timer.left = tLeft(); timer.run = false; tStopTick(); }
  else {
    if (timer.left <= 0) timer.left = timer.total;
    timer.endAt = Date.now() + timer.left; timer.run = true;
    tStopTick(); tTick = setInterval(tDraw, 250);
  }
  tSave(); tDraw();
});
function tSet(ms) {
  timer.total = timer.left = ms; timer.run = false; tStopTick(); tSave();
  $("timer").classList.remove("ring"); tDraw();
}
$("t-reset").addEventListener("click", () => tSet(timer.total));
$("t-presets").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-min]");
  if (b) tSet(Number(b.dataset.min) * 60000);
});
if (timer.run) tTick = setInterval(tDraw, 250);
tDraw();

// ---------- 시작 ----------
renderFixed();
let lastLoad = 0;
$("refresh").addEventListener("click", () => { if (mcp) load().then(() => (lastLoad = Date.now())); else renderFixed(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  renderFixed();
  if (mcp && Date.now() - lastLoad > 120000) load().then(() => (lastLoad = Date.now()));
});
(async () => {
  try { mcp = window.claude ? await window.claude.use("mcp") : null; } catch { mcp = null; }
  if (!mcp) {
    $("status").textContent = "연결 안 됨";
    $("cards").replaceChildren(h("div", { class: "list" }, h("div", { class: "empty" }, "이 페이지는 claude.ai에서 열어야 Todoist를 불러올 수 있어요.")));
    return;
  }
  await load(); lastLoad = Date.now();
})();
</script>
