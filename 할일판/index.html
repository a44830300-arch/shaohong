<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>할일판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 할 일판 1 = 샤오홍슈 작업목록 (나들로그만). 2026-11-25 손그림 수정안:
   🧭 작업 순서 → [🛠️ 작업중 | 🗓️ 월별/분기별 + 📅 이번 주] → 🗂️ 게시물(두 줄, 체크=작업중으로·✕=숨기기)
   → ✅ 끝난 작업물(접기, 완료 날짜 기준 한 주씩) → 📖 컨텐츠 가이드(고치기·추가·지우기).
   직접 적는 칸(월별/분기별·이번 주 체크·숨긴 게시물·컨텐츠 가이드)은 페이지 저장소(db)에 둬서 휴대폰·컴퓨터 같이 봄.
   2026-11-25 추가: 게시물·작업중·이번 주에 직접 추가하는 줄, 게시물 카테고리(직접 만들고 게시물마다 골라 나눔, db board/cats). */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --line: #dfe3de; --fg: #1f2622; --muted: #66706a;
  --accent: #e8731c; --accent-soft: #fdeedf; --red: #d33a2c;
  --green: #3f8f3a; --green-soft: #e1f2dc;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a17; --surface: #1d2420; --line: #2f3833; --fg: #e9eee9; --muted: #9aa59e;
  --accent: #f28a3a; --accent-soft: #3a2a1c; --red: #ff6f61;
  --green: #7cc576; --green-soft: #1f3320; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a17; --surface: #1d2420; --line: #2f3833; --fg: #e9eee9; --muted: #9aa59e;
  --accent: #f28a3a; --accent-soft: #3a2a1c; --red: #ff6f61;
  --green: #7cc576; --green-soft: #1f3320; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; gap: 28px; }
.wrap > section, .top > * { min-width: 0; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 26px; font-weight: 700; }
h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
h2 { margin: 0 0 10px; font-size: 17px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
h2 .right { margin-left: auto; }
button { font: inherit; cursor: pointer; touch-action: manipulation; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { border-color: var(--accent); background: var(--accent-soft); }
.btn:focus-visible, .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) { .btn:hover { border-color: var(--accent); } }
.status { font-size: 12px; color: var(--muted); }

/* 작업 타이머 */
.timer { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 8px; }
.timer::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--p, 0) * 100%); background: var(--accent); }
.t-time { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 22px; min-width: 7ch; text-align: center; }
.t-go { min-width: 60px; }
.t-presets { display: flex; flex-wrap: wrap; gap: 4px; }
.t-presets button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 3px 9px; font-size: 12px; }
.t-presets button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.timer.ring .t-time { color: var(--red); }
@media (prefers-reduced-motion: no-preference) { .timer.ring .t-time { animation: tblink 1s steps(2) infinite; } }
@keyframes tblink { 50% { opacity: .2; } }

/* 작업 순서 */
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; padding: 12px 14px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.steps li { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.steps li .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--font-num); font-size: 12px; }
.steps li + li::before { content: "→"; color: var(--muted); font-weight: 400; margin-right: 2px; }

/* 위쪽: 작업중 | 월별/분기별 + 이번 주 */
.top { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px 16px; align-items: start; }
.top .side { display: grid; gap: 16px; }
.top .side h2 { margin-bottom: 8px; }

/* 목록 공통 */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.empty { color: var(--muted); padding: 16px 14px; font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; min-width: 0; border-top: 1px solid var(--line); }
.list > .row:first-child { border-top: 0; }
.row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; flex: none; cursor: pointer; }
.row .title { flex: 1 1 auto; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.row.done .title { color: var(--muted); text-decoration: line-through; }
.row.busy { opacity: .5; pointer-events: none; }
.x { flex: none; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 15px; line-height: 1; }
@media (hover: hover) { .x:hover { background: var(--accent-soft); color: var(--red); } }
#wip { min-height: 180px; }

/* 직접 추가하는 줄 */
.add { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.add input { flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; }
.add input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.add .btn { flex: none; }

/* 게시물: 카테고리 칸들 */
.posts { display: grid; gap: 12px; }
.cat-bar { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); font-weight: 700; min-width: 0; }
.cat-bar .name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.cat-bar .name::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 8px; vertical-align: middle; }
.cat-bar.none .name::before { background: var(--muted); }
.cat-bar .cnt { flex: none; font-family: var(--font-num); font-size: 12px; color: var(--muted); font-weight: 500; }
.cat-bar .edit-in { font-weight: 700; }
.list.newbox { border-style: dashed; }
.list.newbox .add { border-top: 0; }
.pick { flex: none; max-width: 8.5em; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 2px 6px; font: inherit; font-size: 12px; cursor: pointer; }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip { flex: none; max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 999px; padding: 1px 8px; font-size: 12px; background: var(--green-soft); color: var(--green); font-weight: 600; }

/* 게시물 두 줄 */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
.grid2 > .row:nth-child(-n+2) { border-top: 0; }
.grid2 > .row:nth-child(odd) { border-right: 1px solid var(--line); }
.grid2 > .empty { grid-column: 1 / -1; }
.more { margin-top: 8px; }
.more summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 2px; }
.more .list { margin-top: 6px; }
.restore { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }

/* 끝난 작업물 (접기) */
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
details.fold > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(180deg); }
details.fold > summary .cnt { font-family: var(--font-num); font-size: 13px; color: var(--muted); font-weight: 500; }
.wk { border-top: 1px solid var(--line); }
.wk-h { padding: 8px 14px; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--bg); }
.wk .row { border-top: 1px solid var(--line); }
.wk .row .d { flex: none; font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.wk .row .ok { flex: none; color: var(--green); font-weight: 700; }

/* 컨텐츠 가이드 */
.guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.cat-h { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
.cat-h .name { flex: 1 1 auto; min-width: 0; }
.cat-h .name::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }
.cat ul { list-style: none; margin: 0; padding: 4px 0; flex: 1 1 auto; }
.cat li { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 14px; font-size: 14px; min-width: 0; }
.cat li .t { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.cat li .t::before { content: "· "; color: var(--muted); }
.cat li.none { color: var(--muted); }
.cat li.none .t::before { content: ""; }
.edit-in { flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 14px; }
.cat-h .edit-in { font-weight: 700; }
.cat.newcat { border-style: dashed; justify-content: center; }
.guide .x { width: 26px; height: 26px; font-size: 13px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }

/* ---------- 휴대폰 ---------- */
@media (max-width: 760px) {
  body { font-size: 16px; }
  .wrap { padding-block: 0 56px; gap: 22px; }
  header { position: sticky; top: 0; z-index: 9; background: var(--bg); padding-block: max(8px, env(safe-area-inset-top, 0px)) 8px; align-items: center; row-gap: 6px; column-gap: 8px; box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(0 -100vmax); border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; line-height: 1.2; }
  h1 small { display: inline; font-size: 11px; margin-right: 6px; }
  header .status { display: none; }
  header .btn { padding: 4px 10px; font-size: 12px; }
  .timer { order: 3; flex: 1 1 100%; flex-wrap: nowrap; gap: 5px; padding: 3px 6px 5px; border-radius: 10px; }
  .t-time { font-size: 18px; min-width: 6ch; }
  .t-go { min-width: 46px; flex: none; }
  .t-presets { flex: 1 1 0; min-width: 0; flex-wrap: nowrap; overflow-x: auto; }
  .t-presets button { flex: none; padding: 3px 8px; font-size: 11px; }
  .timer.running .t-presets { display: none; }
  h2, details.fold > summary { font-size: 18px; }
  .top { grid-template-columns: 1fr; }
  #wip { min-height: 0; }
  .pick { max-width: 7em; }
}
@media (max-width: 560px) {
  .grid2 { grid-template-columns: 1fr; }
  .grid2 > .row:nth-child(2) { border-top: 1px solid var(--line); }
  .grid2 > .row:nth-child(odd) { border-right: 0; }
}

/* ── 앱 탭 (2026-11-28: 스케줄표 + 샤오홍슈 작업목록을 한 앱 두 페이지로) ── */
body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
body[data-tab="schedule"] > .wrap, body[data-tab="schedule"] > .toast { display: none !important; }
body[data-tab="xhs"] > #schedule-app { display: none; }
.apptabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: center; gap: 6px;
  padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line); }
.apptabs button { flex: 1; max-width: 220px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--muted);
  font: 600 13px/1.2 var(--font-body); cursor: pointer; }
.apptabs button span { font-size: 20px; line-height: 1; }
.apptabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)) !important; }
@media print { .apptabs { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small id="today-label">오늘</small>샤오홍슈 작업목록</h1>
    <div class="timer" id="timer" role="group" aria-label="작업 타이머">
      <span class="t-time" id="t-time">40:00</span>
      <button class="btn primary t-go" id="t-go" type="button">시작</button>
      <button class="btn" id="t-reset" type="button" aria-label="처음으로">↺</button>
      <div class="t-presets" id="t-presets">
        <button type="button" data-min="10">10분</button>
        <button type="button" data-min="40">40분</button>
        <button type="button" data-min="60">1시간</button>
        <button type="button" data-min="80">1시간 20분</button>
        <button type="button" data-min="120">2시간</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status">불러오는 중…</span>
      <button class="btn" id="refresh" type="button">새로고침</button>
    </div>
  </header>

  <section id="sec-steps">
    <h2>🧭 작업 순서</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <div class="top">
    <section id="sec-wip">
      <h2>🛠️ 작업중</h2>
      <div class="list" id="wip"><div class="empty">불러오는 중…</div></div>
    </section>
    <div class="side">
      <section id="sec-period">
        <h2>🗓️ 월별 / 분기별</h2>
        <div class="list" id="period"></div>
      </section>
      <section id="sec-week">
        <h2>📅 이번 주</h2>
        <div class="list" id="week"></div>
      </section>
    </div>
  </div>

  <section id="sec-posts">
    <h2>🗂️ 게시물 <button class="btn right" id="cat-edit" type="button" hidden>🏷️ 카테고리 만들기·고치기</button></h2>
    <div class="posts" id="posts"><div class="list"><div class="empty">불러오는 중…</div></div></div>
    <details class="more" id="hidden-box" hidden>
      <summary id="hidden-sum">숨긴 게시물</summary>
      <div class="list" id="hidden-list"></div>
    </details>
  </section>

  <details class="fold" id="sec-done">
    <summary>✅ 끝난 작업물 <span class="cnt" id="done-cnt"></span></summary>
    <div id="done"><div class="empty">불러오는 중…</div></div>
  </details>

  <section id="sec-guide">
    <h2>📖 컨텐츠 가이드 <button class="btn right" id="guide-edit" type="button" hidden>✏️ 고치기</button></h2>
    <div class="guide" id="guide"><div class="list"><div class="empty">불러오는 중…</div></div></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const TD = "Todoist";
const IDEA_SECTION = "6hqfQg4Q9MMprpjc";  // 💼 일 > 샤오홍슈 아이디어
const WD = ["일","월","화","수","목","금","토"];
let mcp = null, db = null;
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mdw = (d) => `${d.getMonth() + 1}/${d.getDate()} (${WD[d.getDay()]})`;
const mondayOf = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return addDays(x, -((x.getDay() + 6) % 7)); };
const newId = () => Math.random().toString(36).slice(2, 10);
let toastTimer = null;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 6000); }
const xBtn = (label, onclick) => h("button", { type: "button", class: "x", "aria-label": label, title: label, onclick }, "✕");

// ---------- 🧭 작업 순서 (안내일 뿐, 체크리스트 아님) ----------
const STEPS = ["기획안 짜기", "레퍼런스 찾기", "작업하기", "마무리", "캡션 짜기"];
$("steps").append(...STEPS.map((s, i) => h("li", null, h("span", { class: "n" }, i + 1), s)));

// ---------- 페이지 저장소(db): 월별/분기별 · 이번 주 체크 · 숨긴 게시물 · 컨텐츠 가이드 ----------
// 문서 5개: board/period {items:[{id,text,done}]} · board/week {week, done:{}, extra:[{id,text}]} · board/hidden {ids:[]}
//          board/guide {cats:[{id,name,items:[{id,text}]}]} · board/cats {cats:[{id,name}], assign:{Todoist id: 카테고리 id}}
const store = { period: null, week: null, hidden: null, guide: null, cats: null };
async function save(name, body) {
  if (!db) { toast("이 화면에서는 저장할 수 없어요. claude.ai에서 열어 주세요."); return false; }
  store[name] = body; renderStore();
  try { await db.doc("board/" + name).set(body); return true; }
  catch (e) { toast("저장하지 못했어요. 다시 해 보세요."); return false; }
}
function watchStore() {
  const timer = setTimeout(() => { if (Object.values(store).some((v) => v === null)) toast("저장된 내용을 아직 못 불러왔어요. 잠시 뒤 새로고침해 보세요."); }, 10000);
  for (const name of Object.keys(store)) {
    db.doc("board/" + name).onSnapshot((snap) => {
      store[name] = snap.exists ? snap.data() : {};
      if (!snap.metadata.fromCache && Object.values(store).every((v) => v !== null)) clearTimeout(timer);
      renderStore();
    }, () => { if (store[name] === null) store[name] = {}; renderStore(); });
  }
}
function renderStore() { renderPeriod(); renderWeek(); renderPosts(); renderGuide(); }

// 직접 추가하는 줄 (입력칸 + 추가 버튼, 엔터로도 추가)

  return h("div", { class: "add" }, input, h("button", { type: "button", class: "btn", onclick: go }, "추가"));
}

// ---------- 📅 이번 주 (고정: 날씨달력·축제달력 + 직접 추가, 월요일마다 체크 새로) ----------
// 직접 추가한 것 중 못 끝낸 건 다음 주로 넘어가고, 체크한 건 다음 주에 사라짐

// ---------- 🏷️ 게시물 카테고리 (직접 만들고·이름 고치고·지우고, 게시물마다 골라 나눔) ----------
const catList = () => (store.cats && store.cats.cats) || [];

// ---------- Todoist: 게시물 · 작업중 · 끝난 작업물 (나들로그만) ----------
// 체크(게시물) = 작업중으로(라벨 '진행중') · 작업중 체크 = Todoist 완료 → 끝난 작업물 · 작업중 ✕ = 게시물 목록으로
// 게시물 ✕ = 목록에서만 숨기기(Todoist에는 남음, 아래 "숨긴 게시물"에서 되돌림)
const WIP = "진행중";
const has = (t, l) => (t.labels || []).includes(l);

const isLive = (t) => has(t, "제주라이브") || /^\S*\s*제주라이브\s*:/.test(t.content);

async function pageAll(tool, args) {
  const out = []; let cursor = null;
  for (let i = 0; i < 20; i++) {
    const p = (await mcp.callTool(TD, tool, { ...args, ...(cursor ? { cursor } : {}) }, { cache: false })).payload || {};
    out.push(...(p.tasks || []));

}
async function setWip(t, on, row) {

  try {
    await mcp.callTool(TD, "update-tasks", { tasks: [{ id: t.id, labels }] }, { cache: false });
    t.labels = labels; renderPosts(); toast(on ? "🛠️ 작업중 칸으로 옮겼어요" : "🗂️ 게시물 목록으로 되돌렸어요");

// 직접 추가 = Todoist "샤오홍슈 아이디어"에 새 할 일(이름 앞 "🗿 나들로그:"), 작업중 칸에서 넣으면 라벨 '진행중'도 붙임
async function addPost(text, { catId = "", wip = false } = {}) {
  if (!mcp) { toast("claude.ai에서 열어야 Todoist에 넣을 수 있어요."); return; }
  const content = "🗿 나들로그: " + text;
  const labels = wip ? [WIP] : [];
  try {
    const r = await mcp.callTool(TD, "add-tasks", { tasks: [{ content, sectionId: IDEA_SECTION, ...(wip ? { labels } : {}) }] }, { cache: false });
    let t = (((r && r.payload) || {}).tasks || [])[0];
    if (t && t.id) { t = { content, labels, ...t }; posts.push(t); renderPosts(); }

// ---------- ✅ 끝난 작업물 (완료 날짜 기준 월~일 한 주씩) ----------
const DONE_WEEKS = 8;
function renderDone() {
  if (!loaded) return;
  $("done-cnt").textContent = done.length ? `${done.length}개` : "";
  if (!done.length) { $("done").replaceChildren(h("div", { class: "empty" }, `최근 ${DONE_WEEKS}주 동안 끝난 작업물이 없어요.`)); return; }
  const groups = new Map();
  for (const t of [...done].sort((a, b) => (b.completedAt || "").localeCompare(a.completedAt || ""))) {
    const d = new Date(t.completedAt), key = ymd(mondayOf(d));

}

// ---------- 불러오기 ----------
async function load() {
  const now = new Date();
  $("today-label").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일`;
  renderWeek();
  $("status").textContent = "불러오는 중…"; $("refresh").textContent = "불러오는 중…";
  try {
    const all = await pageAll("find-tasks", { sectionId: IDEA_SECTION, limit: 100 });
    // 머리 할 일 「📋 ○○ 게시물 후보」는 묶음일 뿐이라 빼고 그 밑 할 일은 보여 줌(제주라이브 후보 밑은 뺌). ①②③ 단계는 보여 주지 않음
    const headList = all.filter((t) => !t.parentId && /게시물 후보/.test(t.content));
    heads = new Set(headList.map((t) => t.id));
    liveHeads = new Set(headList.filter((t) => /제주라이브/.test(t.content)).map((t) => t.id));
    posts = all.filter(keep);
    loaded = true; renderPosts();
    try {
      const fin = await pageAll("find-completed-tasks", { sectionId: IDEA_SECTION, since: ymd(addDays(mondayOf(now), -7 * (DONE_WEEKS - 1))), until: ymd(now), limit: 200 });
      done = fin.filter(keep);
    } catch { done = []; toast("끝난 작업물을 불러오지 못했어요."); }
    renderDone();
    $("status").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}에 불러옴`;
  } catch (err) {
    $("posts").replaceChildren(h("div", { class: "list" }, h("div", { class: "empty" }, "Todoist를 불러오지 못했어요. 새로고침해 보세요.")));
    $("wip").replaceChildren(h("div", { class: "empty" }, "Todoist를 불러오지 못했어요."));
    $("status").textContent = "불러오지 못했어요";
  }
  $("refresh").textContent = "새로고침";
}

// ---------- 작업 타이머 (이 기기에만 기억 · 끝나면 소리·진동) ----------
const TKEY = "board-timer";

}
function tLabel(ms) {
  const m = Math.round(ms / 60000), hh = Math.floor(m / 60), mm = m % 60;
  return [hh ? `${hh}시간` : "", mm ? `${mm}분` : ""].filter(Boolean).join(" ");
}
function tDraw() {
  const left = tLeft();
  $("t-time").textContent = tFmt(left);
  $("t-go").textContent = timer.run ? "멈춤" : left > 0 && left < timer.total ? "계속" : "시작";
  $("timer").style.setProperty("--p", 1 - left / timer.total);
  $("timer").classList.toggle("running", timer.run);
  for (const b of $("t-presets").children) b.setAttribute("aria-pressed", String(Number(b.dataset.min) * 60000 === timer.total));
  if (timer.run && left <= 0) tDone();
}
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), at = t0 + i * 0.5;
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.3, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
      o.start(at); o.stop(at + 0.4);
    }
  } catch {}
}
function tStopTick() { clearInterval(tTick); tTick = null; }
function tDone() {
  timer.run = false; timer.left = 0; tSave(); tStopTick();
  $("timer").classList.add("ring");
  beep();
  try { navigator.vibrate?.([400, 200, 400, 200, 400]); } catch {}
  toast(`⏰ ${tLabel(timer.total)} 끝났어요! 잠깐 쉬어 가요`);
  tDraw();
}
$("t-go").addEventListener("click", () => {
  $("timer").classList.remove("ring");
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  if (timer.run) { timer.left = tLeft(); timer.run = false; tStopTick(); }
  else {

    timer.endAt = Date.now() + timer.left; timer.run = true;
    tStopTick(); tTick = setInterval(tDraw, 250);
  }
  tSave(); tDraw();
});
function tSet(ms) {
  timer.total = timer.left = ms; timer.run = false; tStopTick(); tSave();
  $("timer").classList.remove("ring"); tDraw();
}
$("t-reset").addEventListener("click", () => tSet(timer.total));
$("t-presets").addEventListener("click", (e) => {

});

        // 글씨 조각(제목 낱말·시간)은 첫 칸에 다 넣고, fitTexts가 칸 길이에 맞춰 조각째 다음 줄 칸으로 옮긴다
        h("span", { class: bar.items ? "items" : null }, s === bar.s ? [
          ...(bar.items ? bar.items.map((t) => { const iid = `${d}|up|${t}`; const ie = h("i", { class: copied[iid] ? "copied" : null, onclick: (ev) => { ev.stopPropagation(); toggleCopied(iid, ie); } }, t); return ie; }) : [h("b", null, bar.name)]), // 제목은 한 덩어리 (낱말끼리 떨어지지 않게, 2026-11-21 요청)
          h("small", null, `${hm(bar.s)}~${hm(bar.e)}`)].map((x, i) => (x.dataset.tok = i, x)) : null));
      trk.append(el);
    }
    const inRow = day.texts.filter((t) => (hr === H0 ? t.s < b : hr === H1 - 1 ? t.s >= a : t.s >= a && t.s < b)).sort((x, y) => x.s - y.s);
    for (const grp of [inRow.filter((t) => !t.memo), inRow.filter((t) => t.memo)]) {
      if (!grp.length) continue;
      const left = Math.max(0, Math.min(55, (grp[0].s - a) / 60 * 100));
      trk.append(h("div", { class: "tx" + (grp[0].memo ? " memo" : ""), style: `left:${left}%` }, grp.map((t) => {
        const id = `${d}|${t.s}|${t.text}`;
        const el = h("span", { class: "it" + (/^→/.test(t.text) ? " arrow" : "") + (t.red ? " red" : "") + (t.done ? " done" : "") + (copied[id] ? " copied" : ""), title: t.tip, onclick: () => toggleCopied(id, el) }, t.lvl === 3 ? h("span", { class: "imp" }, "!") : null, t.text);
        return el;
      })));
    }
    grid.append(h("div", { class: "hr" }, h("div", { class: "lab" }, hr), trk));
  }
  const top = (7 * 60 - H0 * 60) / 60 * ROW;
  if (day.brkEnd) grid.append(h("div", { class: "brk", style: `top:${top + 3}px;height:${(day.brkEnd - 7 * 60) / 60 * ROW - 6}px` }, h("b", null, "절대 폰X")));
  // 금요일 저녁(19~24시)은 토요일로 옮겨도 됨: 오른쪽 둥근 괄호 + ↔ 토
  if (day.friArrow) grid.append(h("div", { class: "rbrk", style: `top:${(19 - H0) * ROW + 4}px;height:${6 * ROW - 8}px`, title: "금요일 저녁은 비워도 됨 → 토요일로" }, h("b", null, "↔ 토")));
  if (d === TODAY()) {
    const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    if (m >= H0 * 60 && m < H1 * 60) grid.append(h("div", { class: "nowl", style: `top:${(m - H0 * 60) / 60 * ROW}px` }));
  }
  col.append(grid);

  // 빨간 메모
  const memo = h("div", { class: "memo-box" });
  for (const n of day.notes) memo.append(h("div", { class: "star" }, n));
  if (day.allday.length) memo.append(h("div", { class: "star" }, "종일: ", day.allday.map((a) => a.title).join(" · ")));
  const li = (id, cls, ...kids) => { const el = h("li", { class: cls + (copied[id] ? " copied" : ""), onclick: (ev) => { ev.stopPropagation(); toggleCopied(id, el); } }, ...kids); return el; };
  // 금요일: ★ 주말에 어디 갈지 정하기 □ 축제 or 관광지 [도시락, 텀블러 / 버스 시간표]
  if (day.extra) {
    const [title, boxes, sub] = day.extra;
    memo.append(h("h3", { class: "star" }, title));
    const ul = h("ul");
    for (const b of boxes) ul.append(li(`${d}|ex|${b}`, "todo", b, h("div", { class: "sub" }, sub.map((s) => h("div", null, s)))));
    memo.append(ul);
  }
  // ★ 내일 스케줄 □ ...
  if (day.prep.length) {
    const nd = parseYmd(day.nd);
    memo.append(h("h3", { class: "star" }, `${day.prepTitle} (${nd.getMonth() + 1}.${nd.getDate()} ${WD[nd.getDay()]})`));
    const pl = h("ul");
    // 빨간 글씨 아래 검은(회색) 보조 글씨는 넣지 않는다 (2026-11-21 요청)
    for (const [p, , bag] of day.prep) pl.append(li(`${d}|prep|${p}`, "todo", p, bag ? h("div", { class: "sub" }, bag.map((s) => h("div", null, s))) : null));
    memo.append(pl);
  }
  // Todoist 시간 없는 할 일(검은 글씨) 칸은 없앰 (2026-11-21 요청: 할일판2는 검은 글씨 추가 없음)
  col.append(memo);
  return col;
}

// 긴 글씨가 칸 오른쪽 끝에서 잘리면 왼쪽으로 당겨서 다 보이게
function fitTexts() {
  for (const tx of ROOT.querySelectorAll(".tx")) {
    tx.style.removeProperty("transform");
    const over = tx.scrollWidth - tx.clientWidth;
    if (over > 0) {
      const room = tx.offsetLeft;
      tx.style.left = Math.max(0, room - over - 2) + "px";
    }
    // 그래도 넘치면(7시 줄처럼 할 일이 많을 때) 글씨를 줄이고 두 줄로
    tx.classList.remove("dense");
    if (tx.scrollWidth > tx.clientWidth) tx.classList.add("dense");
  }
  // 형광펜 글씨 이어쓰기: 제목 낱말·시간을 조각째로 칸에 채우고, 안 들어가는 조각은 같은 형광펜의 다음 줄 칸으로 (글자 중간에서 자르지 않음)
  const groups = {};
  for (const hl of ROOT.querySelectorAll(".hl[data-id]")) (groups[hl.dataset.id] ||= []).push(hl);
  for (const segs of Object.values(groups)) {
    const spans = segs.map((hl) => hl.querySelector("span"));
    const toks = spans.flatMap((sp) => [...sp.children]).sort((x, y) => x.dataset.tok - y.dataset.tok);
    // 제목 = 한 덩어리, 시간 = 한 덩어리 (2026-11-21 요청: 제목 글자끼리·시간 글자끼리 이어지게)
    const fill = () => {
      toks.forEach((t) => { t.hidden = false; t.remove(); });
      let k = 0, lost = false, moved = false;
      for (const t of toks) {
        while (true) {
          const sp = spans[k], room = segs[k].offsetWidth - 6;
          sp.append(t);
          if (sp.scrollWidth <= room) break;
          if (k < spans.length - 1) { k++; continue; } // 다음 줄 칸으로 덩어리째
          lost = true;
          if (sp.children.length > 1 || t.tagName === "SMALL") t.hidden = true; // 마지막 칸에도 안 들어가면 그 덩어리는 숨김
          break;
        }
        if (t.dataset.tok === "0" && k > 0) moved = true; // 제목이 시작 칸에 못 들어감
      }
      return { lost, moved };
    };
    const tight = (on) => spans.forEach((sp) => sp.classList.toggle("tight", on));
    // 1) 보통 글씨로 시작 칸에 제목이 들어가면 끝 → 2) 글씨를 줄여서 시작 칸에 넣기 → 3) 안 숨겨지는 쪽 → 4) 작은 글씨
    tight(false); const a = fill();
    if (a.lost || a.moved) {
      tight(true); const b = fill();
      // 작은 글씨가 실제로 나아질 때만 작게 둠 (숨김이 사라지거나, 제목이 시작 칸에 들어감)
      const better = (!b.lost && !b.moved) || (a.lost && !b.lost) || (a.lost === b.lost && a.moved && !b.moved) || (a.lost && b.lost);
      if (!better) { tight(false); fill(); }
    }
  }
}

function render() {
  const page = $("page");
  page.classList.toggle("week", mode === "week");
  ROOT.querySelector(".wrap").classList.toggle("wk", mode === "week");
  $("mode").textContent = mode === "week" ? "3일 보기" : "일주일 보기";
  $("prev").setAttribute("aria-label", mode === "week" ? "지난주" : "하루 앞으로");
  $("next").setAttribute("aria-label", mode === "week" ? "다음 주" : "하루 뒤로");
  page.replaceChildren(...Array.from({ length: NDAYS() }, (_, i) => renderDay(buildDay(addDays(start, i)))));
  // 일주일 보기를 옆으로 밀어야 하는 좁은 화면이면 오늘 칸이 보이게
  if (mode === "week") { const t = page.querySelector(".today")?.closest(".day"); if (t && page.scrollWidth > page.clientWidth) page.scrollLeft = t.offsetLeft - page.offsetLeft - 8; }
  requestAnimationFrame(fitTexts);
}

async function load() {
  $("status").textContent = "불러오는 중…";
  $("notice").replaceChildren();
  const today = TODAY();
  const base = start <= today ? today : start;
  const last = addDays(start, NDAYS()); // 마지막 날 + 다음날(내일 스케줄 메모용)
  const days = Math.min(30, Math.max(1, Math.round((parseYmd(last) - parseYmd(base)) / 86400000) + 1));
  const [tk, ev, dc, dt] = await Promise.allSettled([
    mcp.callTool(TD, "find-tasks-by-date", { startDate: base === today ? "today" : base, daysCount: days, limit: 100 }, { cache: false }),
    mcp.callTool(GC, "list_events", { startTime: `${start}T00:00:00`, endTime: `${addDays(start, NDAYS() + 1)}T00:00:00`, orderBy: "startTime", pageSize: 250 }, { cache: false }),
    // 디데이: 앞으로 1년 캘린더 + Todoist 전체에서 시험·발표 찾기
    mcp.callTool(GC, "list_events", { startTime: `${today}T00:00:00`, endTime: `${addDays(today, 365)}T00:00:00`, orderBy: "startTime", pageSize: 250 }, { cache: false }),
    mcp.callTool(TD, "find-tasks", { filter: "search: 시험 | search: 고사 | search: 기말 | search: 발표 | search: 퀴즈 | search: 과제 | search: 리포트 | search: 레포트", limit: 100 }, { cache: false }),
  ]);
  const dd = [];
  if (dc.status === "fulfilled") for (const e of dc.value.payload?.events || []) {
    const t = cleanSummary(e.summary);
    if (e.status === "cancelled" || isChecked(e) || !isDday(t)) continue;
    dd.push({ d: e.start?.dateTime ? ymd(new Date(e.start.dateTime)) : e.start?.date?.slice(0, 10), title: t });
  }
  if (dt.status === "fulfilled") for (const t of dt.value.payload?.tasks || []) {
    const td = taskDate(t);
    if (!td || !isDday(t.content)) continue;
    const title = t.content.replace(/\s*\(.*?\)/g, "").replace(/\s*\S+까지$/, "").trim();
    if (!dd.some((x) => x.d === td && x.title === title)) dd.push({ d: td, title });
  }
  ddays = dd.filter((x) => x.d);
  const errs = [];
  data.tasks = tk.status === "fulfilled" ? tk.value.payload?.tasks || [] : (errs.push("Todoist"), []);
  // 마케팅은 끝남 → 캘린더에 남아 있어도 보여 주지 않음 (2026-11-27 요청)
  data.events = ev.status === "fulfilled" ? (ev.value.payload?.events || []).filter((e) => e.status !== "cancelled" && !/마케팅|마킴|마뗑/.test(e.summary || "")) : (errs.push("구글 캘린더"), []);
  render();
  renderDday();
  const n = new Date();
  // 긴 안내 글씨 대신 위 막대에 짧게만 (2026-11-21 요청)
  $("status").textContent = errs.length ? `${errs.join("·")} 못 불러옴` : `${pad(n.getHours())}:${pad(n.getMinutes())}에 불러옴`;
}

function go(n) { start = n === 0 ? home() : addDays(start, mode === "week" ? n * 7 : n); mcp ? load().catch(() => render()) : render(); }
$("mode").addEventListener("click", () => {
  mode = mode === "week" ? "3" : "week";
  try { localStorage.setItem("nb2-mode", mode); } catch {}
  go(0);
});
$("prev").addEventListener("click", () => go(-1));
$("next").addEventListener("click", () => go(1));
$("today").addEventListener("click", () => go(0));
$("reload").addEventListener("click", () => (mcp ? load().catch(() => render()) : render()));
window.addEventListener("resize", () => requestAnimationFrame(fitTexts));
document.fonts?.ready?.then(fitTexts).catch(() => {});

render(); // 불러오기 전에도 수업·고정표가 있는 노트 모양을 먼저 보여 줌
(async () => {
  try { mcp = window.claude ? await window.claude.use("mcp") : null; } catch { mcp = null; }
  if (!mcp) { $("status").textContent = "Todoist·캘린더 연결 안 됨 (claude.ai에서 열어 주세요)"; return; }
  load().catch(() => { $("status").textContent = "불러오지 못했어요"; });
})();

})();
/* 탭 넘기기: 마지막으로 본 탭을 기억 (이 기기에만) */
(() => {
  const tabs = document.querySelectorAll(".apptabs button");
  const show = (t) => {
    document.body.dataset.tab = t;
    tabs.forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    try { localStorage.setItem("app-tab", t); } catch {}
    document.title = t === "schedule" ? "스케줄표" : "샤오홍슈 작업목록";
    window.scrollTo(0, 0);
    if (t === "schedule") requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
  };
  let t = location.hash === "#xhs" ? "xhs" : location.hash === "#schedule" ? "schedule" : null;
  if (!t) { try { t = localStorage.getItem("app-tab"); } catch {} }
  show(t === "xhs" ? "xhs" : "schedule");
  tabs.forEach((b) => b.addEventListener("click", () => show(b.dataset.tab)));
})();
</script>
