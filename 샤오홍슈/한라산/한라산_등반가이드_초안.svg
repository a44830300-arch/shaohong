<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="4056" viewBox="0 0 1080 4056"><rect id="배경" width="1080" height="4056" fill="#FFFFFF"/><g id="머리"><text x="40" y="80" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="34" font-weight="800" fill="#1B3A5C">❄️ 冬日济州图鉴 VOL.02 (안) — 한라산 등반 가이드 초안</text><text x="40" y="125" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">2026-11-18 · 크리링 · 근거: 최경진 블로그(최신) + 치와니 블로그(2017) 사실 정보 + 공식 주소</text></g><g id="① 잠재 시청자 수"><rect x="40" y="160" width="1000" height="166" rx="20" fill="#F3F8F5"/><text x="70" y="210" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#2F6B4F">① 잠재 시청자 수</text><text x="70" y="258" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">분석판 숫자 아직 안 넣음 → 강정준비준 확인 후 채우기</text><text x="70" y="296" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">(분석판 '내 글을 볼 수 있는 최대 인원' · 지난 동백지도 조회·저장과 비교)</text></g><g id="② 누구를 위한 글 · 여행자 5가지"><rect x="40" y="350" width="1000" height="318" rx="20" fill="#F3F8F5"/><text x="70" y="400" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#2F6B4F">② 누구를 위한 글 · 여행자 5가지</text><text x="70" y="448" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">계정: 나들로그 (겨울 시리즈 VOL.02로 추천)</text><text x="70" y="486" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">이유(크리링 판단): 정보형 겨울 명소글이라 VOL.01 동백과 같은 잡지 시리즈로 묶기 좋음</text><text x="70" y="524" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">주 타겟: ① 계획형 2030 여성</text><text x="70" y="562" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">이유(크리링 판단): 정상 코스는 미리 온라인 예약을 해야 해서 한 달 전 계획하는 사람에게 필요</text><text x="70" y="600" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">보조: ③ 가족 40대 · ④ 패키지 50대 → 어승생악·석굴암 짧은 코스 장</text><text x="70" y="638" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">여행자 5가지: ④ 자연경관 (눈꽃 설경)</text></g><g id="③ 장별 구성 (9장)"><rect x="40" y="692" width="1000" height="850" rx="20" fill="#F3F8F5"/><text x="70" y="742" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#2F6B4F">③ 장별 구성 (9장)</text><text x="70" y="790" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">1장 표지 — 눈 덮인 한라산 사진 + 「冬季汉拿山登山攻略」 + 雪景可看到3月初</text><text x="70" y="828" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">2장 코스 한눈에 — 코스별 왕복 시간 · 난이도 · 풍경 별점 표</text><text x="70" y="866" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    성판악 왕복 8h ★3 · 관음사 왕복 9h ★5 (정상) / 영실→윗세오름→어리목 4h ★2</text><text x="70" y="904" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    영실→남벽분기점→어리목 5h ★2(풍경★5) · 돈내코→어리목 8h ★4 · 어승생악 왕복 1h ★1</text><text x="70" y="942" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">3장 정상 가는 2코스 + 예약 — 성판악(지루하지만 사라오름 설경) vs 관음사(웅장·급경사)</text><text x="70" y="980" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">    예약 필수(무료) · 1명이 4명까지 · 신분증 확인 · 예약 후 1주일 다른 예약 불가</text><text x="70" y="1018" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">    노쇼 1번 3개월 / 2번 1년 예약 금지 → 통제되면 직접 취소해야 함</text><text x="70" y="1056" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">4장 정상 안 가도 설경 — 영실→윗세오름→어리목 (예약 없음, 초보 가능)</text><text x="70" y="1094" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    오백장군 바위 계단 · 구상나무 눈꽃 터널 · 선작지왓 / 힘 남으면 남벽분기점 추천</text><text x="70" y="1132" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">5장 부모님·아이와 — 어승생악(왕복 1시간, 어리목 주차장에서 시작) · 석굴암</text><text x="70" y="1170" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">6장 ⏰ 겨울 시간표 — 모든 코스 05:00부터 입장</text><text x="70" y="1208" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    진달래·삼각봉 11:30 통과 / 영실·어리목 12:00 입장 마감 · 남벽 13:00</text><text x="70" y="1246" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    돈내코 10:00 입장 마감 · 어승생악 17:00 입장 마감</text><text x="70" y="1284" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">7장 🚌 차 두고 가기 — 아침 산길 빙판 · 성판악·영실 주차장 7시 전 만차 · 주차료 크게 오름</text><text x="70" y="1322" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    영실은 주차장→탐방로 입구 가파른 길 약 1시간 더 / 어리목↔영실 버스로 차 찾기</text><text x="70" y="1360" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">8장 🎒 준비물 — 방수 등산복·중등산화·아이젠·스패츠·스틱·핫팩·헤드랜턴</text><text x="70" y="1398" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">    대피소 매점 없음 → 도시락·보온병 챙기기, 쓰레기 다 들고 오기, 라면 국물 화장실 금지</text><text x="70" y="1436" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">9장 ☃️ (새로 추천) 통제되는 날 플랜B + 깨알 팁</text><text x="70" y="1474" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    큰노꼬메오름 · 물영아리오름 · 절물자연휴양림 / 윗세오름 CCTV 앞에서 춤추면 홈페이지에 나옴</text><text x="70" y="1512" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">    이유(크리링 판단): 눈 오면 통제가 잦아 '저장'할 이유가 되고, CCTV 팁은 댓글 거리</text></g><g id="④ 제목 (중국어 · 병음 · 한국어 뜻)"><rect x="40" y="1566" width="1000" height="204" rx="20" fill="#F2F5FA"/><text x="70" y="1616" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#1B3A5C">④ 제목 (중국어 · 병음 · 한국어 뜻)</text><text x="70" y="1664" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">冬季汉拿山登山攻略｜7条路线一次看懂🏔️</text><text x="70" y="1702" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">dōngjì Hànnáshān dēngshān gōnglüè | qī tiáo lùxiàn yí cì kàn dǒng</text><text x="70" y="1740" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">겨울 한라산 등산 공략｜7개 코스 한 번에 이해하기🏔️</text></g><g id="⑤ 캡션 초안 (중국어 → 병음 → 아래에 한국어 뜻 같은 모양)"><rect x="40" y="1794" width="1000" height="1382" rx="20" fill="#F2F5FA"/><text x="70" y="1844" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#1B3A5C">⑤ 캡션 초안 (중국어 → 병음 → 아래에 한국어 뜻 같은 모양)</text><text x="70" y="1892" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">🏔️ 冬天来济州，一定要看一次汉拿山的雪景！</text><text x="70" y="1930" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">dōngtiān lái Jìzhōu, yídìng yào kàn yí cì Hànnáshān de xuějǐng!</text><text x="70" y="1968" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">⛰️ 汉拿山一共有7条登山路线</text><text x="70" y="2006" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">Hànnáshān yígòng yǒu qī tiáo dēngshān lùxiàn</text><text x="70" y="2044" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">✅ 想登顶：城板岳 / 观音寺（要提前网上免费预约）</text><text x="70" y="2082" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">xiǎng dēngdǐng: Chéngbǎnyuè / Guānyīnsì (yào tíqián wǎngshàng miǎnfèi yùyuē)</text><text x="70" y="2120" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">✅ 不登顶也能看雪景：灵室 / 御里牧</text><text x="70" y="2158" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">bù dēngdǐng yě néng kàn xuějǐng: Língshì / Yùlǐmù</text><text x="70" y="2196" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">✅ 带孩子、带爸妈：御乘生岳（往返约1小时）</text><text x="70" y="2234" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">dài háizi, dài bàmā: Yùchéngshēngyuè (wǎngfǎn yuē yì xiǎoshí)</text><text x="70" y="2272" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">⏰ 早上5点开放入山，太晚了就上不去</text><text x="70" y="2310" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">zǎoshang wǔ diǎn kāifàng rùshān, tài wǎn le jiù shàng bu qù</text><text x="70" y="2348" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">🪪 登顶要带护照，预约后不去要记得取消</text><text x="70" y="2386" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">dēngdǐng yào dài hùzhào, yùyuē hòu bú qù yào jìde qǔxiāo</text><text x="70" y="2424" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">🍙 山上没有小卖部，午餐和热水自己带</text><text x="70" y="2462" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">shānshang méiyǒu xiǎomàibù, wǔcān hé rèshuǐ zìjǐ dài</text><text x="70" y="2500" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">🗑️ 垃圾全部带下山</text><text x="70" y="2538" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">lājī quánbù dài xià shān</text><text x="70" y="2576" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">🧤 下雪天一定要带冰爪</text><text x="70" y="2614" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">xiàxuě tiān yídìng yào dài bīngzhuǎ</text><text x="70" y="2652" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">你想走哪一条路线？评论区告诉我～</text><text x="70" y="2690" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">nǐ xiǎng zǒu nǎ yì tiáo lùxiàn? pínglùnqū gàosu wǒ~</text><text x="70" y="2728" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222"></text><text x="70" y="2766" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">🏔️ 겨울에 제주 오면 한라산 설경은 꼭 한 번 보세요!</text><text x="70" y="2804" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">⛰️ 한라산 등산 코스는 모두 7개</text><text x="70" y="2842" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">✅ 정상 가려면: 성판악 / 관음사 (미리 온라인 무료 예약)</text><text x="70" y="2880" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">✅ 정상 안 가도 설경: 영실 / 어리목</text><text x="70" y="2918" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">✅ 아이·부모님과: 어승생악 (왕복 약 1시간)</text><text x="70" y="2956" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">⏰ 아침 5시부터 입산, 너무 늦으면 못 올라가요</text><text x="70" y="2994" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">🪪 정상 가려면 여권 지참, 예약하고 안 가면 꼭 취소하기</text><text x="70" y="3032" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">🍙 산 위엔 매점이 없어요, 점심·뜨거운 물은 직접 챙기기</text><text x="70" y="3070" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">🗑️ 쓰레기는 전부 들고 내려오기</text><text x="70" y="3108" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">🧤 눈 오는 날엔 아이젠 꼭 챙기기</text><text x="70" y="3146" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">어느 코스 가고 싶으세요? 댓글로 알려 주세요~</text></g><g id="⑥ 최신 글(오름사진작가 최경진)로 고친 것 · 아직 확인할 것"><rect x="40" y="3200" width="1000" height="508" rx="20" fill="#FDF3F2"/><text x="70" y="3250" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#C0392B">⑥ 최신 글(오름사진작가 최경진)로 고친 것 · 아직 확인할 것</text><text x="70" y="3298" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">✔ 고친 것</text><text x="70" y="3336" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 입산 시간 06:00 → 05:00 · 정상 통과 12:00 → 11:30 · 영실 입장 마감 12:00</text><text x="70" y="3374" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 코스 시간: 편도 → 왕복 (정상 8~9시간) · 난이도·풍경 별점 추가</text><text x="70" y="3412" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 매점(컵라면) 없음 확정 → 도시락·쓰레기 수칙 넣음 · 예약 규칙·노쇼 벌칙 넣음</text><text x="70" y="3450" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 차보다 버스·택시 (빙판·만차·주차료) · 통제 날 플랜B · CCTV 팁 · 설경은 3월 초까지</text><text x="70" y="3488" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">❗ 아직 확인 안 함</text><text x="70" y="3526" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 정상(백록담) 하산 시작 시간 — 최신 글에 없음</text><text x="70" y="3564" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 버스 번호 — 최신 글에 없음 (2017년 번호는 뺌)</text><text x="70" y="3602" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 외국인 예약 방법(여권 번호로 되는지) · 예약 사이트 중국어 지원</text><text x="70" y="3640" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 코스 중국어 이름(城板岳·灵室·御里牧·御乘生岳) 샤오홍슈에서 실제 쓰는 이름인지</text><text x="70" y="3678" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 공식 주소: 성판악 제주시 조천읍 516로 1865 · 관음사 제주시 산록북로 588</text></g><g id="⑦ 심사 체크 (xhs-review-check)"><rect x="40" y="3732" width="1000" height="280" rx="20" fill="#FAF6F0"/><text x="70" y="3782" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#6B4F2F">⑦ 심사 체크 (xhs-review-check)</text><text x="70" y="3830" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 最·第一 안 씀 ('한국 최고봉' 대신 '해발 1,947m'로)</text><text x="70" y="3868" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 예약 사이트 주소·QR 넣지 않기 → '公园官网(공원 공식 사이트)'라고만</text><text x="70" y="3906" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 블로그 사진·글 그대로 쓰지 않기 → 사실 정보만, 사진은 직접 찍은 것/허락받은 것</text><text x="70" y="3944" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 위챗·다른 앱 이름 없음 ✔</text><text x="70" y="3982" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 장비 대여 업체 이름은 넣지 않기 (숨은 광고로 보일 수 있음)</text></g></svg>