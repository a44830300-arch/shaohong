<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3144" viewBox="0 0 1080 3144"><rect id="배경" width="1080" height="3144" fill="#FFFFFF"/><g id="머리"><text x="40" y="80" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="34" font-weight="800" fill="#1B3A5C">❄️ 冬日济州图鉴 VOL.02 (안) — 한라산 등반 가이드 초안</text><text x="40" y="125" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">2026-11-18 · 크리링 · 근거: 치와니 블로그(2017.12) 사실 정보 + 한라산국립공원 공식 주소</text></g><g id="① 잠재 시청자 수"><rect x="40" y="160" width="1000" height="166" rx="20" fill="#F3F8F5"/><text x="70" y="210" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#2F6B4F">① 잠재 시청자 수</text><text x="70" y="258" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">분석판 숫자 아직 안 넣음 → 강정준비준 확인 후 채우기</text><text x="70" y="296" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">(분석판 '내 글을 볼 수 있는 최대 인원' · 지난 동백지도 조회·저장과 비교)</text></g><g id="② 누구를 위한 글 · 여행자 5가지"><rect x="40" y="350" width="1000" height="318" rx="20" fill="#F3F8F5"/><text x="70" y="400" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#2F6B4F">② 누구를 위한 글 · 여행자 5가지</text><text x="70" y="448" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">계정: 나들로그 (겨울 시리즈 VOL.02로 추천)</text><text x="70" y="486" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">이유(크리링 판단): 정보형 겨울 명소글이라 VOL.01 동백과 같은 잡지 시리즈로 묶기 좋음</text><text x="70" y="524" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">주 타겟: ① 계획형 2030 여성</text><text x="70" y="562" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">이유(크리링 판단): 정상 코스는 미리 온라인 예약을 해야 해서 한 달 전 계획하는 사람에게 필요</text><text x="70" y="600" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">보조: ③ 가족 40대 · ④ 패키지 50대 → 어승생악·석굴암 짧은 코스 장</text><text x="70" y="638" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">여행자 5가지: ④ 자연경관 (눈꽃 설경)</text></g><g id="③ 장별 구성 (8장)"><rect x="40" y="692" width="1000" height="508" rx="20" fill="#F3F8F5"/><text x="70" y="742" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#2F6B4F">③ 장별 구성 (8장)</text><text x="70" y="790" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">1장 표지 — 눈 덮인 한라산 사진 + 「冬季汉拿山登山攻略」 + 7条路线一次看懂</text><text x="70" y="828" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">2장 7코스 한눈에 — 지도 위 7개 입구 + 정상 가능/시간/난이도 표</text><text x="70" y="866" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    성판악 9.6km 4h30 · 관음사 8.7km 5h (정상) / 영실 5.8km 2h30 · 어리목 6.8km 3h</text><text x="70" y="904" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">    돈내코 3h · 어승생악 1.3km 30분 · 석굴암 약 50분</text><text x="70" y="942" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">3장 정상 가는 2코스 — 성판악(평탄, 사라오름 들르기) vs 관음사(계곡·왕관릉, 경치)</text><text x="70" y="980" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">    정상 코스는 온라인 예약 필수 (블로그엔 없음, 2021년부터 생김)</text><text x="70" y="1018" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">4장 정상 안 가도 설경 — 영실(병풍바위) · 어리목(설원) → 윗세오름에서 만남</text><text x="70" y="1056" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">5장 부모님·아이와 — 어승생악(30분, '작은 한라산') · 석굴암(숲길 산책)</text><text x="70" y="1094" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">6장 ⏰ 겨울 시간표 — 입산 06:00 · 진달래밭/삼각봉 12:00 통과 · 정상 13:30 하산</text><text x="70" y="1132" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">7장 🚌 버스로 가기 — 성판악 281·181 / 관음사 475 / 영실·어리목·어승생악 240</text><text x="70" y="1170" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">8장 🧤 준비물·주의 — 아이젠 필수 · 눈 오면 통제 · 출발 전 공식 사이트 확인</text></g><g id="④ 제목 (중국어 · 병음 · 한국어 뜻)"><rect x="40" y="1224" width="1000" height="204" rx="20" fill="#F2F5FA"/><text x="70" y="1274" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#1B3A5C">④ 제목 (중국어 · 병음 · 한국어 뜻)</text><text x="70" y="1322" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">冬季汉拿山登山攻略｜7条路线一次看懂🏔️</text><text x="70" y="1360" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">dōngjì Hànnáshān dēngshān gōnglüè | qī tiáo lùxiàn yí cì kàn dǒng</text><text x="70" y="1398" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">겨울 한라산 등산 공략｜7개 코스 한 번에 이해하기🏔️</text></g><g id="⑤ 캡션 초안 (중국어 → 병음 → 아래에 한국어 뜻 같은 모양)"><rect x="40" y="1452" width="1000" height="1040" rx="20" fill="#F2F5FA"/><text x="70" y="1502" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#1B3A5C">⑤ 캡션 초안 (중국어 → 병음 → 아래에 한국어 뜻 같은 모양)</text><text x="70" y="1550" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">🏔️ 冬天来济州，一定要看一次汉拿山的雪景！</text><text x="70" y="1588" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">dōngtiān lái Jìzhōu, yídìng yào kàn yí cì Hànnáshān de xuějǐng!</text><text x="70" y="1626" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">⛰️ 汉拿山一共有7条登山路线</text><text x="70" y="1664" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">Hànnáshān yígòng yǒu qī tiáo dēngshān lùxiàn</text><text x="70" y="1702" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">✅ 想登顶：城板岳 / 观音寺（要提前网上预约）</text><text x="70" y="1740" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">xiǎng dēngdǐng: Chéngbǎnyuè / Guānyīnsì (yào tíqián wǎngshàng yùyuē)</text><text x="70" y="1778" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">✅ 不登顶也能看雪景：灵室 / 御里牧</text><text x="70" y="1816" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">bù dēngdǐng yě néng kàn xuějǐng: Língshì / Yùlǐmù</text><text x="70" y="1854" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">✅ 带孩子、带爸妈：御乘生岳（约30分钟）</text><text x="70" y="1892" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">dài háizi, dài bàmā: Yùchéngshēngyuè (yuē sānshí fēnzhōng)</text><text x="70" y="1930" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">⏰ 冬季入山有时间限制，来晚了就上不去</text><text x="70" y="1968" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">dōngjì rùshān yǒu shíjiān xiànzhì, lái wǎn le jiù shàng bu qù</text><text x="70" y="2006" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">🧤 下雪天一定要带冰爪</text><text x="70" y="2044" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">xiàxuě tiān yídìng yào dài bīngzhuǎ</text><text x="70" y="2082" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#222">你想走哪一条路线？评论区告诉我～</text><text x="70" y="2120" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#777">nǐ xiǎng zǒu nǎ yì tiáo lùxiàn? pínglùnqū gàosu wǒ~</text><text x="70" y="2158" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222"></text><text x="70" y="2196" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">🏔️ 겨울에 제주 오면 한라산 설경은 꼭 한 번 보세요!</text><text x="70" y="2234" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">⛰️ 한라산 등산 코스는 모두 7개</text><text x="70" y="2272" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">✅ 정상 가려면: 성판악 / 관음사 (미리 온라인 예약)</text><text x="70" y="2310" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">✅ 정상 안 가도 설경: 영실 / 어리목</text><text x="70" y="2348" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">✅ 아이·부모님과: 어승생악 (약 30분)</text><text x="70" y="2386" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">⏰ 겨울엔 입산 시간 제한, 늦으면 못 올라가요</text><text x="70" y="2424" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">🧤 눈 오는 날엔 아이젠 꼭 챙기기</text><text x="70" y="2462" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">어느 코스 가고 싶으세요? 댓글로 알려 주세요~</text></g><g id="⑥ 올리기 전 꼭 확인할 것 (블로그가 2017년 글)"><rect x="40" y="2516" width="1000" height="318" rx="20" fill="#FDF3F2"/><text x="70" y="2566" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#C0392B">⑥ 올리기 전 꼭 확인할 것 (블로그가 2017년 글)</text><text x="70" y="2614" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 겨울 입산·통과·하산 시간 — 2017년 기준이라 지금과 다를 수 있음 (확인 안 함)</text><text x="70" y="2652" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 버스 번호 — 2017년 기준 (확인 안 함)</text><text x="70" y="2690" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 윗세오름 매점(컵라면) — 블로그엔 있지만 지금은 운영 안 하는 걸로 앎 (확인 안 함)</text><text x="70" y="2728" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 예약 시스템 중국어 지원·외국인 예약 방법 (공식 사이트에 中文 메뉴는 있음)</text><text x="70" y="2766" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#C0392B">• 코스 중국어 이름(城板岳·灵室·御里牧·御乘生岳 등) 샤오홍슈에서 실제 쓰는 이름인지</text><text x="70" y="2804" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 공식 주소: 성판악 제주시 조천읍 516로 1865 · 관음사 제주시 산록북로 588</text></g><g id="⑦ 심사 체크 (xhs-review-check)"><rect x="40" y="2858" width="1000" height="242" rx="20" fill="#FAF6F0"/><text x="70" y="2908" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#6B4F2F">⑦ 심사 체크 (xhs-review-check)</text><text x="70" y="2956" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 最·第一 안 씀 ('한국 최고봉' 대신 '해발 1,947m'로)</text><text x="70" y="2994" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 예약 사이트 주소·QR 넣지 않기 → '公园官网(공원 공식 사이트)'라고만</text><text x="70" y="3032" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 블로그 사진·글 그대로 쓰지 않기 → 사실 정보만, 사진은 직접 찍은 것/허락받은 것</text><text x="70" y="3070" font-family="'Noto Sans KR','Noto Sans SC','Malgun Gothic',sans-serif" font-size="24" font-weight="400" fill="#222">• 위챗·다른 앱 이름 없음 ✔</text></g></svg>