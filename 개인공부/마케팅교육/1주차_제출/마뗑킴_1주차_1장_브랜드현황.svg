<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F4EF"/>
<text x="72" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="end">1 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#151515" stroke-width="2"/>
<text x="72" y="128" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">01  브랜드 현황</text>
<text x="72" y="200" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">주력 상품</text>
<text x="242" y="200" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">가방 · 지갑 · 빅로고 티</text>
<line x1="72" y1="223.0" x2="1008" y2="223.0" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="250.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">주요 채널</text>
<text x="242" y="250.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">인스타그램</text>
<line x1="72" y1="273.2" x2="1008" y2="273.2" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="300.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">최근 캠페인</text>
<text x="242" y="300.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">2026 앰버서더 5명 — 리즈(봄) · 제노(여름, 첫 남성) · 모모(가을, 남녀 공용) · 리노(FW) ·</text>
<text x="242" y="327.95" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">김채원(겨울 ‘The New Wind’)</text>
<line x1="72" y1="350.95" x2="1008" y2="350.95" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="388.15" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#151515" text-anchor="start">경쟁사 2곳</text>
<rect x="72.0" y="414.15" width="456.0" height="250" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="98.0" y="458.15" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start">지금의 패션 경쟁자</text>
<text x="98.0" y="498.15" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="26" font-weight="800" fill="#151515" text-anchor="start">마리떼 프랑소와 저버</text>
<text x="98.0" y="540.15" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">패션 쪽에서 마뗑킴과 같이 엮이는데, 이미 먼저 브랜드</text>
<text x="98.0" y="566.25" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">확장을 적극적으로 하고 있다.</text>
<rect x="552.0" y="414.15" width="456.0" height="250" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="578.0" y="458.15" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start">앞으로의 라이프스타일 경쟁자</text>
<text x="578.0" y="498.15" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="26" font-weight="800" fill="#151515" text-anchor="start">젠틀몬스터</text>
<text x="578.0" y="540.15" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">마뗑킴이 추구하는 이미지를 젠틀몬스터가 이미</text>
<text x="578.0" y="566.25" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">선점하고 있다.</text>
</svg>
