<rect x="552.0" y="569.6500000000001" width="456.0" height="250" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="578.0" y="613.6500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start">앞으로의 라이프스타일 경쟁자</text>
<text x="578.0" y="653.6500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="26" font-weight="800" fill="#151515" text-anchor="start">젠틀몬스터</text>
<text x="578.0" y="695.6500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">안경 브랜드가 디저트(누데이크) · 향수(탬버린즈) ·</text>
<text x="578.0" y="721.7500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">공간으로 넓혀 ‘감각 좋은 브랜드’가 됨 → 마뗑킴이</text>
<text x="578.0" y="747.8500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">가려는 자리.</text>
