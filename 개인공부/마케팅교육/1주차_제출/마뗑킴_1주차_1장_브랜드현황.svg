<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F4EF"/>
<text x="72" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="end">1 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#151515" stroke-width="2"/>
<text x="72" y="128" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">01  브랜드 현황</text>
<text x="72" y="196" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="46" font-weight="800" fill="#151515" text-anchor="start">옷은 잘 파는데, 아직 ‘여자 옷 브랜드’다</text>
<text x="72" y="259.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="500" fill="#6B6B6B" text-anchor="start">매출·해외 모두 ‘3마’ 1위지만, 손님 머릿속엔 “로고 큰 여성 의류·가방”으로만 남아 있다.</text>
<text x="72" y="291.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="500" fill="#6B6B6B" text-anchor="start">라이프스타일로 넓히려면 이 이미지부터 넓혀야 한다.</text>
<text x="72" y="353.29999999999995" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">기본</text>
<text x="242" y="353.29999999999995" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">하고하우스 운영 · 2025년 매출 2,201억 원(+33.9%), 영업이익 445억 원 · ‘3마’ 중 1위</text>
<line x1="72" y1="376.29999999999995" x2="1008" y2="376.29999999999995" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="403.49999999999994" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">주력 상품</text>
<text x="242" y="403.49999999999994" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">가방 · 지갑 · 액세서리 / 패딩 · 기모 집업</text>
<line x1="72" y1="426.49999999999994" x2="1008" y2="426.49999999999994" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="453.69999999999993" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">주요 채널</text>
<text x="242" y="453.69999999999993" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">인스타그램 · 유튜브 / 무신사 · 29CM · 카카오톡 선물하기 / 성수(210평, 카페 정원) · 명동 ·</text>
<text x="242" y="481.24999999999994" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">도산 매장 / 해외 매장 26개(일본 5 · 홍콩 · 마카오 · 대만 · 태국 · 몽골 · 베트남), 미국 아마존</text>
<line x1="72" y1="504.25" x2="1008" y2="504.25" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="531.45" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">최근 캠페인</text>
<text x="242" y="531.45" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">2026 앰버서더 5명 — 리즈(봄) · 제노(여름, 첫 남성) · 모모(가을, 남녀 공용) · 리노(FW) ·</text>
<text x="242" y="559.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">김채원(겨울 ‘The New Wind’)</text>
<line x1="72" y1="582.0" x2="1008" y2="582.0" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="609.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">확장 신호</text>
<text x="242" y="609.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">라네즈 뷰티 협업(10/1) · 아티스트 전시 ‘NEW WORDS, NEW WORTH’(3천 명+) · 첫</text>
<text x="242" y="636.75" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="400" fill="#151515" text-anchor="start">아이웨어(7/1) · LG트윈스 협업(7/20) · 성수 외벽 아트 프로젝트(10/22~)</text>
<line x1="72" y1="659.75" x2="1008" y2="659.75" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="696.95" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#151515" text-anchor="start">경쟁사 2곳</text>
<rect x="72.0" y="722.95" width="456.0" height="250" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="98.0" y="766.95" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start">지금의 패션 경쟁자</text>
<text x="98.0" y="806.95" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="26" font-weight="800" fill="#151515" text-anchor="start">마리떼 프랑소와 저버</text>
<text x="98.0" y="848.95" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">2025년 매출 1,919억 원(+27.2%). 같은 2030</text>
<text x="98.0" y="875.0500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">여성 · 로고 · 해외 확장. 손님이 “마뗑킴이랑</text>
<text x="98.0" y="901.1500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">헷갈린다”.</text>
<rect x="552.0" y="722.95" width="456.0" height="250" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="578.0" y="766.95" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start">앞으로의 라이프스타일 경쟁자</text>
<text x="578.0" y="806.95" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="26" font-weight="800" fill="#151515" text-anchor="start">젠틀몬스터</text>
<text x="578.0" y="848.95" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">안경 브랜드가 디저트(누데이크) · 향수(탬버린즈) ·</text>
<text x="578.0" y="875.0500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">공간으로 넓혀 ‘감각 좋은 브랜드’가 됨 → 마뗑킴이</text>
<text x="578.0" y="901.1500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">가려는 자리.</text>
</svg>
