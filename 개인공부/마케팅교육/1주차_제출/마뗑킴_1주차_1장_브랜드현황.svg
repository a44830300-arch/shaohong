<text x="98.0" y="695.6500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">2025년 매출 1,919억 원(+27.2%). 같은 2030</text>
<text x="98.0" y="721.7500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">여성 · 로고 · 해외 확장. 손님이 “마뗑킴이랑</text>
