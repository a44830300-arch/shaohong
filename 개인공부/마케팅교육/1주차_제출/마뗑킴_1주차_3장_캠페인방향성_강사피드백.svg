<svg width="1690" height="1096" viewBox="0 0 1690 1096" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1690" height="1096" fill="#FFFFFF"/>
<g id="3/3 캠페인 방향성">
<rect width="810" height="1096" fill="#F7F8FA"/>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="54" y="49.3">MATIN KIM 2팀 · 1주차 분석 및 방향</tspan></text>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="732" y="49.3">3 / 3</tspan></text>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="22" font-weight="bold"><tspan x="54" y="100.3">캠페인 방향성</tspan></text>
<rect x="54" y="121.5" width="20" height="20" rx="4" fill="#36577C"/>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="60.5" y="135.9">1</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="bold"><tspan x="82" y="137.5">최종 목표</tspan></text>
<rect x="54.5" y="153.5" width="701" height="76" rx="9.5" fill="#E6EDF5"/>
<rect x="54.5" y="153.5" width="701" height="76" rx="9.5" stroke="#DDE3EA"/>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="500"><tspan x="73" y="184.4">최종 목표</tspan></text>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="165" y="186.4">자회사 문구 브랜드 만들기</tspan></text>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="500"><tspan x="73" y="210.9">과정</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="165" y="211.3">펜·노트 회사 협업 등 작은 캠페인부터</tspan></text>
<rect x="54" y="243.5" width="20" height="20" rx="4" fill="#36577C"/>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="60.5" y="257.9">2</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="bold"><tspan x="82" y="259.5">셀프 체크 5문</tspan></text>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="bold"><tspan x="54" y="296.3">WHAT</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="134" y="296.3">여행을 하며 마뗑킴 펜으로 트래블 노트를 작성한다.</tspan></text>
<rect x="54" y="309" width="702" height="1" fill="#DDE3EA"/>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="bold"><tspan x="54" y="330.3">WHY</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="134" y="330.3">브랜드 이미지를 여성 중심에서 벗어나게 하고, 브랜드의 다양한 면을 보여 주기 위해.</tspan></text>
<rect x="54" y="343" width="702" height="1" fill="#DDE3EA"/>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="bold"><tspan x="54" y="364.3">WHEN</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="134" y="364.3">휴가·연휴 시즌 (겨울 여행)</tspan></text>
<rect x="54" y="377" width="702" height="1" fill="#DDE3EA"/>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="bold"><tspan x="54" y="398.3">HOW</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="134" y="398.3">펜 회사·노트 회사와 협업(미도리, 몰스킨, 홍디안 등) + 계절별 앰버서더와 함께 영상 광고&#10;</tspan><tspan x="134" y="415.3">· 건강한 여행: 러닝도 하고(본사 옷) 산책을 즐기면서 트래블 노트 작성&#10;</tspan><tspan x="134" y="432.3">· 오락성 여행: 시내에서 재미있게 놀고 사진을 찍으면서 트래블 노트 작성. 사진도 붙이면서.</tspan></text>
<rect x="54" y="445" width="702" height="1" fill="#DDE3EA"/>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="bold"><tspan x="54" y="466.3">IF</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="134" y="466.3">“감성·감각 좋은 여성 의류 브랜드” → “마뗑킴 자체가 센스 좋은 브랜드”로 인식이 바뀐다.</tspan></text>
<rect x="54" y="479" width="702" height="1" fill="#DDE3EA"/>
<rect x="54" y="492.5" width="20" height="20" rx="4" fill="#36577C"/>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="60.5" y="506.9">3</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="bold"><tspan x="82" y="508.5">문구 브랜드 SWOT</tspan></text>
<rect x="54.5" y="524.5" width="344" height="112" rx="9.5" fill="#E6EDF5"/>
<rect x="54.5" y="524.5" width="344" height="112" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="73" y="555.4">S</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="89" y="553.4">강점</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="73" y="578.3">·  2030 여성 팬덤 = 다꾸·텍스트힙 소비층</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="73" y="599.3">·  ‘글·말’ 주제 전시 경험(NEW WORDS, NEW WORTH)</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="73" y="620.3">·  옷 외 상품 경험(아이웨어·뷰티 굿즈)</tspan></text>
<rect x="411.5" y="524.5" width="344" height="112" rx="9.5" fill="white"/>
<rect x="411.5" y="524.5" width="344" height="112" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="430" y="555.4">W</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="451" y="553.4">약점</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="430" y="578.3">·  문구를 만들고 팔아 본 경험 없음</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="430" y="599.3">·  로고만 찍은 굿즈로 보일 위험</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="430" y="620.3">·  문구는 단가가 낮아 매출이 작음</tspan></text>
<rect x="54.5" y="647.5" width="344" height="112" rx="9.5" fill="white"/>
<rect x="54.5" y="647.5" width="344" height="112" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="73" y="678.4">O</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="92" y="676.4">기회</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="73" y="701.3">·  텍스트힙 — 메타 2026 주요 트렌드</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="73" y="722.3">·  비싸도 예쁜 문구 찾는 2030 여성 증가</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="73" y="743.3">·  프리미엄 문구 박람회 인기(인벤타리오 2026)</tspan></text>
<rect x="411.5" y="647.5" width="344" height="70" rx="9.5" fill="#E6EDF5"/>
<rect x="411.5" y="647.5" width="344" height="70" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="430" y="678.4">T</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="446" y="676.4">위협</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="430" y="701.3">·  자리 잡은 감성 문구 브랜드 많음(오롤리데이 등)</tspan></text>
<rect x="54" y="773.5" width="20" height="20" rx="4" fill="#36577C"/>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="60.5" y="787.9">4</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="bold"><tspan x="82" y="789.5">경쟁사 3곳</tspan></text>
<rect x="54.5" y="805.5" width="226.333" height="120" rx="9.5" fill="white"/>
<rect x="54.5" y="805.5" width="226.333" height="120" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="10" font-weight="bold"><tspan x="69" y="829">라이프스타일 경쟁자</tspan></text>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="69" y="856.4">젠틀몬스터</tspan></text>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="10"><tspan x="149" y="856">누데이크 · 탬버린즈</tspan></text>
<rect x="69" y="868" width="197" height="1" fill="#DDE3EA"/>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="69" y="890.3">마뗑킴이 추구하는 이미지를 젠틀몬스터</tspan><tspan x="69" y="907.3">가 이미 선점하고 있다.</tspan></text>
<rect x="291.833" y="805.5" width="226.333" height="120" rx="9.5" fill="white"/>
<rect x="291.833" y="805.5" width="226.333" height="120" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="10" font-weight="bold"><tspan x="306.333" y="829">문구 경쟁자</tspan></text>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="306.333" y="856.4">아날로그키퍼</tspan></text>
<rect x="306.333" y="868" width="197" height="1" fill="#DDE3EA"/>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="306.333" y="890.3">문구류에서 앞으로 추구해야 할 이미지</tspan><tspan x="306.333" y="907.3">가 겹친다.</tspan></text>
<rect x="529.167" y="805.5" width="226.333" height="120" rx="9.5" fill="white"/>
<rect x="529.167" y="805.5" width="226.333" height="120" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="10" font-weight="bold"><tspan x="543.667" y="829">문구 경쟁자</tspan></text>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="543.667" y="856.4">이나피스퀘어</tspan></text>
<rect x="543.667" y="868" width="197" height="1" fill="#DDE3EA"/>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12"><tspan x="543.667" y="890.3">블랙 앤 화이트로 브랜드 색이 겹친다.</tspan></text>
<rect x="54" y="939.5" width="20" height="20" rx="4" fill="#36577C"/>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="60.5" y="953.9">5</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="bold"><tspan x="82" y="955.5">페르소나 1명</tspan></text>
<rect x="54" y="971" width="702" height="85" rx="10" fill="#476A91"/>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="17" font-weight="bold"><tspan x="76" y="1006.8">강정준 · 28세 여성</tspan></text>
<text fill="#C3D3E6" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="500"><tspan x="276" y="1004.4">직장</tspan></text>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="307" y="1004.8">직장 2년 차</tspan></text>
<text fill="#C3D3E6" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="500"><tspan x="456" y="1004.4">관심</tspan></text>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="487" y="1004.8">꾸미는 것에 관심이 많다.</tspan></text>
<text fill="#C3D3E6" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="500"><tspan x="76" y="1035.9">여행</tspan></text>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="107" y="1036.3">혼자 여행을 좋아한다.</tspan></text>
<text fill="#C3D3E6" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="500"><tspan x="276" y="1035.9">SNS</tspan></text>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="308" y="1036.3">SNS 활동을 자주 하고, 본인의 것을 보여 주는 걸 좋아한다.</tspan></text>
</g>
<g id="강사 피드백 — 3/3 (미적용)" transform="translate(870 0)">
<rect x="0.75" y="0.75" width="818.5" height="898.5" rx="13.25" fill="#FFF6D6"/>
<rect x="0.75" y="0.75" width="818.5" height="898.5" rx="13.25" stroke="#EBCF7A" stroke-width="1.5"/>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="22" font-weight="bold"><tspan x="33.5" y="58.8">강사 피드백 · 3/3 캠페인 방향성</tspan></text>
<text fill="#8A6D1F" xml:space="preserve" font-family="Noto Sans KR" font-size="13" font-weight="500"><tspan x="33.5" y="95.7">강사님 피드백 원문 정리(2026-11-12)예요. 왼쪽 본문에는 아직 적용하지 않았어요.</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="142.9">⭐ 가장 중요: 실제로 뭘 할지가 빠져 있다</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="169.9">•  ‘자회사 문구 브랜드 만들기’라는 목표만 있고 브랜드가 어떻게 생겼는지는 없다 → 대표님께 보고한다고 생각하고 답하기</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="195.9">•  왜 문구인가? 미션은 ‘라이프스타일’ → 홈 · 향 · F&#38;B · 문구 후보를 ① 마뗑킴 강점 ② 고객 ③ 돈이 되는지로 비교해 문구를 고른 과정 </tspan><tspan x="33.5" y="215.9">보여 주기</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="241.9">•  답해야 할 것: 컨셉 · 브랜드명(후보 2~3개) · 슬로건(국문+영문) · 이미지(무드보드) · 제품 라인업 · 가격(경쟁사 실제 가격 옆 비교) · </tspan><tspan x="33.5" y="261.9">유통 순서 · 단계별 계획 · 마케팅 · 예산과 목표</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="287.9">•  ‘작은 콜라보부터’ → 단계 + 기준으로 바꾸기. 다음 단계로 넘어가는 기준은 숫자로 (날짜보다 기준이 중요)</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="313.9">•  마케팅은 알리기 / 사게 하기 / 다시 사게 하기 각각 채널·콘텐츠·협업(협업 상대 이름까지)</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="339.9">•  예산은 항목별 금액·비중, 성공 판단 숫자 3~5개. 가정한 숫자는 ‘가정’이라고 표시</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="386.9">셀프 체크 5문</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="413.9">•  WHY(‘여성 중심 이미지에서 벗어나기’)와 페르소나(28세 여성 1명)가 따로 논다 → WHY를 바꾸거나, 남성/외국인 페르소나 추가 중 하</tspan><tspan x="33.5" y="433.9">나</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="459.9">•  장면이 너무 많다(펜으로 노트 쓰기, 러닝, 사진 붙이기, 건강한/오락성 여행 두 버전) → 언제·어디서·뭘 쓰는지 장면 하나로 좁히기</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="506.9">문구 브랜드 SWOT</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="533.9">•  SWOT에서 SO / WO / ST / WT 전략을 뽑고, 캠페인이 그중 하나에서 나오게</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="559.9">•  위협 추가: 가격 경쟁, 재고 부담, 패션 브랜드 굿즈 피로감</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="606.9">경쟁사 3곳</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="633.9">•  ‘선점하고 있다’, ‘이미지가 겹친다’, ‘블랙 앤 화이트가 겹친다’는 이유가 아니라 인상이다</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="659.9">•  경쟁사마다 같은 기준으로 비교: 가격대(대표 제품 실제 가격) · 주 고객 · 판매 채널 · 배울 점 · 다르게 갈 점</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="685.9">•  포지셔닝 맵 한 장 (예: 가격 × 감성/기능) → 마뗑킴 문구가 들어갈 빈자리 보이게</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="711.9">•  젠틀몬스터는 경쟁자가 아니라 패션 → 디저트·뷰티로 넓힌 참고 사례. 어떤 순서로 넓혔는지 정리</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="758.9">페르소나</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="785.9">•  나이·직장·취향만으로는 뭘 만들고 어디에 광고할지 못 정한다</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="811.9">•  채울 것: 지금 어떤 다이어리·펜을 얼마에 어디서 사는지 / 마뗑킴에서 뭘 사 봤고 요즘 왜 덜 사는지 / 지금 문구에서 불편한 점 / 하루에 </tspan><tspan x="33.5" y="831.9">어떤 앱을 언제 보는지 / 어떤 순간에 지갑을 여는지</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="857.9">•  페르소나 2명: ① 국내 기존 팬 1명 ② 매장을 찾는 해외 관광객 1명</tspan></text>
</g>
</svg>
