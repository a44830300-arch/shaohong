<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F7F9FB"/>
<text x="72" y="70.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B7785" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B7785" text-anchor="end">3 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#1F2A37" stroke-width="2"/>
<text x="72" y="150.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#3A5A80" text-anchor="start">05  최종 목표</text>
<rect x="72" y="174.0" width="936" height="132.0" rx="14" fill="#E7EEF5" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="104" y="226.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#3A5A80" text-anchor="start">최종 목표</text>
<text x="242" y="226.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="26" font-weight="800" fill="#1F2A37" text-anchor="start">자회사 문구 브랜드 만들기</text>
<text x="104" y="276.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#3A5A80" text-anchor="start">과정</text>
<text x="242" y="276.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="500" fill="#1F2A37" text-anchor="start">펜·노트 회사 협업 등 작은 캠페인부터</text>
<text x="72" y="366.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#3A5A80" text-anchor="start">06  방향 — 셀프 체크 5문</text>
<text x="72" y="426.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">WHAT</text>
<text x="72" y="454.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#6B7785" text-anchor="start">무엇을</text>
<text x="232" y="426.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#1F2A37" text-anchor="start">여행을 하며 마뗑킴 펜으로 트래블 노트를 작성한다.</text>
<line x1="72" y1="478.0" x2="1008" y2="478.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="522.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">WHY</text>
<text x="72" y="550.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#6B7785" text-anchor="start">왜</text>
<text x="232" y="522.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#1F2A37" text-anchor="start">브랜드 이미지를 여성 중심에서 벗어나게 하고, 브랜드의 여러 면을 보여 주기 위해.</text>
<line x1="72" y1="574.0" x2="1008" y2="574.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="618.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">WHEN</text>
<text x="72" y="646.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#6B7785" text-anchor="start">언제</text>
<text x="232" y="618.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#1F2A37" text-anchor="start">휴가·연휴 시즌 (겨울 여행)</text>
<line x1="72" y1="670.0" x2="1008" y2="670.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="714.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">HOW</text>
<text x="72" y="742.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#6B7785" text-anchor="start">어떻게</text>
<text x="232" y="714.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#1F2A37" text-anchor="start">펜 회사·노트 회사와 협업(미도리, 몰스킨, 홍디안 등) + 계절별 앰버서더와 함께 영상 광고</text>
<text x="232" y="755.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#1F2A37" text-anchor="start">· 건강한 여행: 러닝도 하고(본사 옷) 산책을 즐기면서 트래블 노트 작성</text>
<text x="232" y="796.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#1F2A37" text-anchor="start">· 오락성 여행: 시내에서 재미있게 놀고 사진을 찍으면서 트래블 노트 작성. 사진도 붙이면서.</text>
<line x1="72" y1="820.0" x2="1008" y2="820.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="864.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">IF</text>
<text x="72" y="892.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="600" fill="#6B7785" text-anchor="start">그러면</text>
<text x="232" y="864.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#1F2A37" text-anchor="start">“감성·감각 좋은 여성 의류 브랜드” → “마뗑킴 자체가 센스 좋은 브랜드”로 인식이 바뀐다.</text>
<line x1="72" y1="916.0" x2="1008" y2="916.0" stroke="#DCE3EB" stroke-width="1"/>
<rect x="72" y="952.0" width="936" height="318.0" rx="14" fill="#36577B"/>
<text x="112" y="1008.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#CFDDEC" text-anchor="start">07  캠페인 컨셉</text>
<text x="112" y="1064.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="start">지금까지는 ‘옷 입은’ 마뗑킴,</text>
<text x="112" y="1112.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="start">이제는 ‘쓰기도’ 한다</text>
<line x1="112" y1="1148.0" x2="968" y2="1148.0" stroke="#5A7799" stroke-width="1"/>
<text x="112" y="1192.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#CFDDEC" text-anchor="start">가제</text>
<text x="112" y="1240.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">마뗑킴, 쓰다  (MATIN KIM WRITES)</text>
</svg>
