<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F4EF"/>
<text x="72" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="end">3 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#151515" stroke-width="2"/>
<text x="72" y="128" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">03  방향 — 셀프 체크 5문 + 컨셉</text>
<text x="72" y="200" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHAT</text>
<text x="202" y="200" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">여행을 하며 마뗑킴 펜으로 트래블 노트를 작성한다.</text>
<line x1="72" y1="227.0" x2="1008" y2="227.0" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="257.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHY</text>
<text x="202" y="257.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">브랜드 이미지를 여성에서 남성·중성으로 옮기고, 브랜드의 여러 면을 보여 주기 위해.</text>
<line x1="72" y1="284.8" x2="1008" y2="284.8" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="315.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHEN</text>
<text x="202" y="315.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">휴가·연휴 시즌 (겨울 여행)</text>
<line x1="72" y1="342.6" x2="1008" y2="342.6" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="373.40000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">HOW</text>
<text x="202" y="373.40000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">펜 회사·노트 회사와 협업(미도리, 몰스킨, 홍디안 등) + 영상 광고</text>
<text x="202" y="403.85" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">· 건강한 여행: 러닝도 하고(본사 옷) 산책을 즐기면서 트래블 노트 작성</text>
<text x="202" y="434.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">· 오락성 여행: 시내에서 재미있게 놀고 사진을 찍으면서 트래블 노트 작성. 사진도 붙이면서.</text>
<line x1="72" y1="461.3" x2="1008" y2="461.3" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="492.1" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">IF</text>
<text x="202" y="492.1" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">“감성·감각 좋은 여성 의류 브랜드” → “마뗑킴 자체가 센스 좋은 브랜드”로 인식이</text>
<text x="202" y="522.5500000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">바뀐다.</text>
<line x1="72" y1="549.5500000000001" x2="1008" y2="549.5500000000001" stroke="#D9D5CC" stroke-width="1"/>
<rect x="72" y="600.35" width="936" height="300" rx="14" fill="#1F3A5F"/>
<text x="108" y="656.35" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#BFD0E6" text-anchor="start">캠페인 컨셉</text>
<text x="108" y="712.35" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="start">지금까지는 ‘옷 입은’ 마뗑킴, 이제는 ‘쓰기도’ 한다</text>
<text x="108" y="790.35" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#BFD0E6" text-anchor="start">가제</text>
<text x="108" y="844.35" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start">마뗑킴, 쓰다  (MATIN KIM WRITES)</text>
</svg>
