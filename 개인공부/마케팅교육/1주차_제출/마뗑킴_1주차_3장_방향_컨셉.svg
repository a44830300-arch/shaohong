<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F4EF"/>
<text x="72" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="end">3 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#151515" stroke-width="2"/>
<text x="72" y="128" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">03  방향 — 셀프 체크 5문 + 컨셉</text>
<text x="72" y="200" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHAT</text>
<text x="202" y="200" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">옷 브랜드 마뗑킴을 ‘여행 문구’로 라이프스타일까지 넓힌다.</text>
<line x1="72" y1="227.0" x2="1008" y2="227.0" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="257.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHY</text>
<text x="202" y="257.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">여성 이미지를 남성·중성으로 넓히고, 옷 말고도 브랜드의 여러 면을 보여 주기 위해.</text>
<line x1="72" y1="284.8" x2="1008" y2="284.8" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="315.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHEN</text>
<text x="202" y="315.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">겨울 여행</text>
<line x1="72" y1="342.6" x2="1008" y2="342.6" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="373.40000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">HOW</text>
<text x="202" y="373.40000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">문구 브랜드와 협업한 ‘트래블 노트 + 펜’ — 마뗑킴 펜으로 여행 노트를 쓰는 캠페인.</text>
<line x1="72" y1="400.40000000000003" x2="1008" y2="400.40000000000003" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="431.20000000000005" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">IF</text>
<text x="202" y="431.20000000000005" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">“감성 좋은 여성 옷 브랜드” → “마뗑킴 자체가 센스 좋은 브랜드”로 생각이 바뀐다.</text>
<line x1="72" y1="458.20000000000005" x2="1008" y2="458.20000000000005" stroke="#D9D5CC" stroke-width="1"/>
<rect x="72" y="509.00000000000006" width="936" height="360" rx="14" fill="#1F3A5F"/>
<text x="108" y="565.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#BFD0E6" text-anchor="start">캠페인 컨셉 한 줄</text>
<text x="108" y="619.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="start">—</text>
<text x="108" y="699.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#BFD0E6" text-anchor="start">가제</text>
<text x="108" y="753.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start">—</text>
</svg>
