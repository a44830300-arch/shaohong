<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F4EF"/>
<text x="72" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="end">3 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#151515" stroke-width="2"/>
<text x="72" y="128" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">03  방향 — 셀프 체크 5문 + 컨셉</text>
<text x="72" y="196" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="36" font-weight="800" fill="#151515" text-anchor="start">“옷 잘 입는 사람 집에 갔더니, 쓰는 물건까지 다 감각 있더라”</text>
<text x="72" y="246.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#6B6B6B" text-anchor="start">지금은 ‘트렌디한 여성 옷과 액세서리 브랜드’ → 이번 캠페인으로 ‘마뗑킴 자체가 센스 있는 브랜드’로</text>
<text x="72" y="311.25" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHAT</text>
<text x="202" y="311.25" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">옷 브랜드 마뗑킴을 ‘여행 문구’로 라이프스타일까지 넓힌다.</text>
<line x1="72" y1="338.25" x2="1008" y2="338.25" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="369.05" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHY</text>
<text x="202" y="369.05" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">여성 이미지를 남성·중성으로 넓히고, 옷 말고도 브랜드의 여러 면을 보여 주기 위해.</text>
<line x1="72" y1="396.05" x2="1008" y2="396.05" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="426.85" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">WHEN</text>
<text x="202" y="426.85" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">겨울 여행 → 봄 여행 시즌(2027년 1~4월). 설 연휴·봄방학처럼 여행이 몰리는 때.</text>
<line x1="72" y1="453.85" x2="1008" y2="453.85" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="484.65000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">HOW</text>
<text x="202" y="484.65000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">문구 브랜드와 협업한 ‘트래블 노트 + 펜’ — 마뗑킴 펜으로 여행 노트를 쓰는 캠페인.</text>
<line x1="72" y1="511.65" x2="1008" y2="511.65" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="542.4499999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1F3A5F" text-anchor="start">IF</text>
<text x="202" y="542.4499999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#151515" text-anchor="start">“감성 좋은 여성 옷 브랜드” → “마뗑킴 자체가 센스 좋은 브랜드”로 생각이 바뀐다.</text>
<line x1="72" y1="569.4499999999999" x2="1008" y2="569.4499999999999" stroke="#D9D5CC" stroke-width="1"/>
<rect x="72" y="620.2499999999999" width="936" height="360" rx="14" fill="#1F3A5F"/>
<text x="108" y="676.2499999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#BFD0E6" text-anchor="start">캠페인 컨셉 한 줄</text>
<text x="108" y="726.2499999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="start">옷 잘 입는 사람은 여행 노트도 다르다 — 마뗑킴 펜으로 적는 나의</text>
<text x="108" y="767.8499999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="start">여행</text>
<text x="108" y="839.4499999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#BFD0E6" text-anchor="start">가제</text>
<text x="108" y="887.4499999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start">MATIN NOTE : 여행을 적는 감각</text>
<text x="108" y="931.4499999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#DCE6F2" text-anchor="start">또는  Write the New Wind  (겨울 캠페인 ‘The New Wind’와 이어서)</text>
</svg>
