<text x="72" y="134.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="800" fill="#3A5A80" text-anchor="start">04  경쟁사 3곳</text>
<rect x="72.0" y="152.0" width="301.3333333333333" height="191.8" rx="14" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="94.0" y="188.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#3A5A80" text-anchor="start">라이프스타일 경쟁자</text>
<text x="94.0" y="224.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#1F2A37" text-anchor="start">젠틀몬스터</text>
<text x="205.75" y="224.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="500" fill="#6B7785" text-anchor="start">누데이크 · 탬버린즈</text>
<line x1="94.0" y1="244" x2="351.3333333333333" y2="244" stroke="#DCE3EB" stroke-width="1"/>
<text x="94.0" y="274.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">마뗑킴이 추구하는 이미지를</text>
<text x="94.0" y="298.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">젠틀몬스터가 이미 선점하고 있다.</text>
<rect x="389.3333333333333" y="152.0" width="301.3333333333333" height="191.8" rx="14" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="411.3333333333333" y="188.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#3A5A80" text-anchor="start">문구 경쟁자</text>
<text x="411.3333333333333" y="224.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#1F2A37" text-anchor="start">아날로그키퍼</text>
<line x1="411.3333333333333" y1="244" x2="668.6666666666666" y2="244" stroke="#DCE3EB" stroke-width="1"/>
<text x="411.3333333333333" y="274.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">문구류에서 앞으로 추구해야 할 이미지가</text>
<text x="411.3333333333333" y="298.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">겹친다.</text>
<rect x="706.6666666666666" y="152.0" width="301.3333333333333" height="191.8" rx="14" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="728.6666666666666" y="188.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#3A5A80" text-anchor="start">문구 경쟁자</text>
<text x="728.6666666666666" y="224.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#1F2A37" text-anchor="start">이나피스퀘어</text>
<line x1="728.6666666666666" y1="244" x2="986.0" y2="244" stroke="#DCE3EB" stroke-width="1"/>
<text x="728.6666666666666" y="274.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">블랙 앤 화이트로 브랜드 색이 겹친다.</text>
<text x="72" y="397.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="800" fill="#3A5A80" text-anchor="start">05  최종 목표</text>
<rect x="72" y="415.3" width="936" height="92.0" rx="14" fill="#E7EEF5" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="100" y="453.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#3A5A80" text-anchor="start">최종 목표</text>
<text x="222" y="453.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F2A37" text-anchor="start">자회사 문구 브랜드 만들기</text>
<text x="100" y="487.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#3A5A80" text-anchor="start">과정</text>
<text x="222" y="487.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#1F2A37" text-anchor="start">펜·노트 회사 협업 등 작은 캠페인부터</text>
<text x="72" y="560.9" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="800" fill="#3A5A80" text-anchor="start">06  방향 — 셀프 체크 5문</text>
<text x="72" y="610.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">WHAT</text>
<text x="170" y="610.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#1F2A37" text-anchor="start">여행을 하며 마뗑킴 펜으로 트래블 노트를 작성한다.</text>
<line x1="72" y1="627.2" x2="1008" y2="627.2" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="658.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">WHY</text>
<text x="170" y="658.4" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#1F2A37" text-anchor="start">브랜드 이미지를 여성 중심에서 벗어나게 하고, 브랜드의 다양한 면을 보여 주기 위해.</text>
<line x1="72" y1="675.5" x2="1008" y2="675.5" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="706.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">WHEN</text>
<text x="170" y="706.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#1F2A37" text-anchor="start">휴가·연휴 시즌 (겨울 여행)</text>
<line x1="72" y1="723.8" x2="1008" y2="723.8" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="755.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">HOW</text>
<text x="170" y="755.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#1F2A37" text-anchor="start">펜 회사·노트 회사와 협업(미도리, 몰스킨, 홍디안 등) + 계절별 앰버서더와 함께 영상 광고</text>
<text x="170" y="779.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#1F2A37" text-anchor="start">· 건강한 여행: 러닝도 하고(본사 옷) 산책을 즐기면서 트래블 노트 작성</text>
<text x="170" y="803.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#1F2A37" text-anchor="start">· 오락성 여행: 시내에서 재미있게 놀고 사진을 찍으면서 트래블 노트 작성. 사진도 붙이면서.</text>
<line x1="72" y1="820.1" x2="1008" y2="820.1" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="851.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">IF</text>
<text x="170" y="851.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="400" fill="#1F2A37" text-anchor="start">“감성·감각 좋은 여성 의류 브랜드” → “마뗑킴 자체가 센스 좋은 브랜드”로 인식이 바뀐다.</text>
<line x1="72" y1="868.4" x2="1008" y2="868.4" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="922.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="800" fill="#3A5A80" text-anchor="start">07  문구 브랜드 SWOT</text>
