<text x="96.0" y="1150.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#3A5A80" text-anchor="start">O</text>
<text x="120.765625" y="1150.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">기회</text>
<text x="96.0" y="1186.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="1186.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">텍스트힙 — 메타 2026 주요 트렌드</text>
<text x="96.0" y="1216.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="1216.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">비싸도 예쁜 문구 찾는 2030 여성 증가</text>
<text x="96.0" y="1246.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="1246.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">프리미엄 문구 박람회 인기(인벤타리오 2026)</text>
