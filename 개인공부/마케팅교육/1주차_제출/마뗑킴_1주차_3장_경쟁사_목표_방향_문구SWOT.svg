<text x="96.0" y="1014.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="1014.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">2030 여성 팬덤 = 다꾸·텍스트힙 소비층</text>
<text x="96.0" y="1044.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="1044.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">‘글·말’ 주제 전시 경험(NEW WORDS, NEW WORTH)</text>
<text x="96.0" y="1074.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="1074.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">옷 외 상품 경험(아이웨어·뷰티 굿즈)</text>
<rect x="548.0" y="940.0" width="460.0" height="160.0" rx="14" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.5"/>
