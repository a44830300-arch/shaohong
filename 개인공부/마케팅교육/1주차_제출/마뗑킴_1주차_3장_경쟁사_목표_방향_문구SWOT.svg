<text x="602.609375" y="978.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">약점</text>
<text x="572.0" y="1014.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="588.0" y="1014.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">문구를 만들고 팔아 본 경험 없음</text>
<text x="572.0" y="1044.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="588.0" y="1044.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">로고만 찍은 굿즈로 보일 위험</text>
<text x="572.0" y="1074.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="588.0" y="1074.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="500" fill="#1F2A37" text-anchor="start">문구는 단가가 낮아 매출이 작음</text>
