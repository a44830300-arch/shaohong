<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F7F9FB"/>
<text x="72" y="70.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B7785" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B7785" text-anchor="end">3 / 4</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#1F2A37" stroke-width="2"/>
<text x="72" y="140.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#3A5A80" text-anchor="start">05  최종 목표</text>
<rect x="72" y="160.0" width="936" height="104.0" rx="14" fill="#E7EEF5" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="104" y="202.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#3A5A80" text-anchor="start">최종 목표</text>
<text x="242" y="202.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#1F2A37" text-anchor="start">자회사 문구 브랜드 만들기</text>
<text x="104" y="243.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#3A5A80" text-anchor="start">과정</text>
<text x="242" y="243.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="500" fill="#1F2A37" text-anchor="start">펜·노트 회사 협업 등 작은 캠페인부터</text>
<text x="72" y="312.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#3A5A80" text-anchor="start">06  방향 — 셀프 체크 5문</text>
<text x="72" y="358.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" fill="#3A5A80" text-anchor="start">WHAT</text>
<text x="72" y="380.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="600" fill="#6B7785" text-anchor="start">무엇을</text>
<text x="202" y="358.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#1F2A37" text-anchor="start">여행을 하며 마뗑킴 펜으로 트래블 노트를 작성한다.</text>
<line x1="72" y1="396.0" x2="1008" y2="396.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="432.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" fill="#3A5A80" text-anchor="start">WHY</text>
<text x="72" y="454.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="600" fill="#6B7785" text-anchor="start">왜</text>
<text x="202" y="432.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#1F2A37" text-anchor="start">브랜드 이미지를 여성 중심에서 벗어나게 하고, 브랜드의 다양한 면을 보여 주기 위해.</text>
<line x1="72" y1="470.0" x2="1008" y2="470.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="506.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" fill="#3A5A80" text-anchor="start">WHEN</text>
<text x="72" y="528.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="600" fill="#6B7785" text-anchor="start">언제</text>
<text x="202" y="506.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#1F2A37" text-anchor="start">휴가·연휴 시즌 (겨울 여행)</text>
<line x1="72" y1="544.0" x2="1008" y2="544.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="580.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" fill="#3A5A80" text-anchor="start">HOW</text>
<text x="72" y="602.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="600" fill="#6B7785" text-anchor="start">어떻게</text>
<text x="202" y="580.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#1F2A37" text-anchor="start">펜 회사·노트 회사와 협업(미도리, 몰스킨, 홍디안 등) + 계절별 앰버서더와 함께 영상 광고</text>
<text x="202" y="608.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#1F2A37" text-anchor="start">· 건강한 여행: 러닝도 하고(본사 옷) 산책을 즐기면서 트래블 노트 작성</text>
<text x="202" y="636.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#1F2A37" text-anchor="start">· 오락성 여행: 시내에서 재미있게 놀고 사진을 찍으면서 트래블 노트 작성. 사진도 붙이면서.</text>
<line x1="72" y1="652.0" x2="1008" y2="652.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="688.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" fill="#3A5A80" text-anchor="start">IF</text>
<text x="72" y="710.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="600" fill="#6B7785" text-anchor="start">그러면</text>
<text x="202" y="688.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#1F2A37" text-anchor="start">“감성·감각 좋은 여성 의류 브랜드” → “마뗑킴 자체가 센스 좋은 브랜드”로 인식이 바뀐다.</text>
<line x1="72" y1="726.0" x2="1008" y2="726.0" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="770.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#3A5A80" text-anchor="start">07  문구 브랜드 SWOT</text>
<rect x="72" y="790.0" width="458" height="233.0" rx="14" fill="#E7EEF5" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="96" y="830.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">S</text>
<text x="121.3125" y="830.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800" fill="#3A5A80" text-anchor="start">강점</text>
<text x="96" y="868.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112" y="868.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">2030 여성 팬덤 = 다꾸·텍스트힙 소비층</text>
<text x="96" y="908.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112" y="908.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">‘글·말’ 주제 전시 경험(NEW WORDS, NEW WORTH)</text>
<text x="96" y="949.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112" y="949.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">옷 외 상품 경험(아이웨어·뷰티 굿즈)</text>
<text x="96" y="990.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112" y="990.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">외국인 손님 많음 → 기념품 판로</text>
<rect x="550" y="790.0" width="458" height="233.0" rx="14" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="574" y="830.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">W</text>
<text x="608.65625" y="830.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800" fill="#3A5A80" text-anchor="start">약점</text>
<text x="574" y="868.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="590" y="868.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">문구를 만들고 팔아 본 경험 없음</text>
<text x="574" y="908.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="590" y="908.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">로고만 찍은 굿즈로 보일 위험</text>
<text x="574" y="949.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="590" y="949.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">문구는 단가가 낮아 매출이 작음</text>
<rect x="72" y="1037.0" width="458" height="233.0" rx="14" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="96" y="1077.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">O</text>
<text x="124.28125" y="1077.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800" fill="#3A5A80" text-anchor="start">기회</text>
<text x="96" y="1115.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112" y="1115.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">텍스트힙 — 메타 2026 주요 트렌드</text>
<text x="96" y="1155.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112" y="1155.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">비싸도 예쁜 문구 찾는 2030 여성 증가</text>
<text x="96" y="1196.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112" y="1196.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">프리미엄 문구 박람회 인기(인벤타리오 2026)</text>
<text x="96" y="1237.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112" y="1237.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">패션×문구 협업 선례(마르디×몰스킨)</text>
<rect x="550" y="1037.0" width="458" height="233.0" rx="14" fill="#E7EEF5" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="574" y="1077.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#3A5A80" text-anchor="start">T</text>
<text x="599.6875" y="1077.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800" fill="#3A5A80" text-anchor="start">위협</text>
<text x="574" y="1115.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="590" y="1115.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">자리 잡은 감성 문구 브랜드 많음(오롤리데이 등)</text>
<text x="574" y="1155.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="590" y="1155.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">패션×문구 협업이 새롭지 않게 보일 수 있음</text>
<text x="574" y="1196.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="590" y="1196.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">유행이 식으면 수요 감소</text>
</svg>
