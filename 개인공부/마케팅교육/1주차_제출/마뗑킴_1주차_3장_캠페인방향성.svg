<text x="411.3333333333333" y="1031.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F2A37" text-anchor="start">아날로그키퍼</text>
<line x1="411.3333333333333" y1="1047.7272727272725" x2="668.6666666666666" y2="1047.7272727272725" stroke="#DCE3EB" stroke-width="1"/>
