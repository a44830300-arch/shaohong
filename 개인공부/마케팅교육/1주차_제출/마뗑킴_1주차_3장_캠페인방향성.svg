<text x="411.3333333333333" y="1095.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="500" fill="#1F2A37" text-anchor="start">겹친다.</text>
<rect x="706.6666666666666" y="971.7" width="301.3333333333333" height="141.1" rx="14" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="728.6666666666666" y="1001.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#3A5A80" text-anchor="start">문구 경쟁자</text>
<text x="728.6666666666666" y="1031.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F2A37" text-anchor="start">이나피스퀘어</text>
<line x1="728.6666666666666" y1="1047.7272727272725" x2="986.0" y2="1047.7272727272725" stroke="#DCE3EB" stroke-width="1"/>
