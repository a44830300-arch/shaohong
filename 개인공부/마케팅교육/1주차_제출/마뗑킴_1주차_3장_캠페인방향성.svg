<text x="94.0" y="1031.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F2A37" text-anchor="start">젠틀몬스터</text>
<text x="197.078125" y="1031.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" font-weight="500" fill="#6B7785" text-anchor="start">누데이크 · 탬버린즈</text>
<line x1="94.0" y1="1047.7272727272725" x2="351.3333333333333" y2="1047.7272727272725" stroke="#DCE3EB" stroke-width="1"/>
