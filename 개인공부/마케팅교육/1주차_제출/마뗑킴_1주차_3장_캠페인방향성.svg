<text x="72" y="144.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#1F2A37" text-anchor="start">캠페인 방향성</text>
<rect x="72" y="167.0" width="26" height="26.0" rx="6" fill="#3A5A80"/>
<text x="85" y="186.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="110" y="187.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" fill="#3A5A80" text-anchor="start">최종 목표</text>
<rect x="72" y="205.0" width="936" height="82.0" rx="14" fill="#E7EEF5" stroke="#DCE3EB" stroke-width="1.5"/>
