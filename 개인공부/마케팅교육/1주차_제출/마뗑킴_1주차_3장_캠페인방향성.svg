<text x="222" y="239.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="800" fill="#1F2A37" text-anchor="start">자회사 문구 브랜드 만들기</text>
<text x="100" y="269.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#3A5A80" text-anchor="start">과정</text>
<text x="222" y="269.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#1F2A37" text-anchor="start">펜·노트 회사 협업 등 작은 캠페인부터</text>
<rect x="72" y="296.2" width="26" height="26.0" rx="6" fill="#3A5A80"/>
<text x="85" y="315.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="110" y="316.2" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" fill="#3A5A80" text-anchor="start">셀프 체크 5문</text>
<text x="72" y="359.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#3A5A80" text-anchor="start">WHAT</text>
<text x="170" y="359.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="400" fill="#1F2A37" text-anchor="start">여행을 하며 마뗑킴 펜으로 트래블 노트를 작성한다.</text>
<line x1="72" y1="372.4" x2="1008" y2="372.4" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="398.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#3A5A80" text-anchor="start">WHY</text>
<text x="170" y="398.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="400" fill="#1F2A37" text-anchor="start">브랜드 이미지를 여성 중심에서 벗어나게 하고, 브랜드의 다양한 면을 보여 주기 위해.</text>
<line x1="72" y1="410.7" x2="1008" y2="410.7" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="436.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#3A5A80" text-anchor="start">WHEN</text>
<text x="170" y="436.3" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="400" fill="#1F2A37" text-anchor="start">휴가·연휴 시즌 (겨울 여행)</text>
<line x1="72" y1="448.9" x2="1008" y2="448.9" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="474.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#3A5A80" text-anchor="start">HOW</text>
<text x="170" y="474.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="400" fill="#1F2A37" text-anchor="start">펜 회사·노트 회사와 협업(미도리, 몰스킨, 홍디안 등) + 계절별 앰버서더와 함께 영상 광고</text>
<text x="170" y="496.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="400" fill="#1F2A37" text-anchor="start">· 건강한 여행: 러닝도 하고(본사 옷) 산책을 즐기면서 트래블 노트 작성</text>
<text x="170" y="518.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="400" fill="#1F2A37" text-anchor="start">· 오락성 여행: 시내에서 재미있게 놀고 사진을 찍으면서 트래블 노트 작성. 사진도 붙이면서.</text>
<line x1="72" y1="531.1" x2="1008" y2="531.1" stroke="#DCE3EB" stroke-width="1"/>
<text x="72" y="556.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#3A5A80" text-anchor="start">IF</text>
<text x="170" y="556.7" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="400" fill="#1F2A37" text-anchor="start">“감성·감각 좋은 여성 의류 브랜드” → “마뗑킴 자체가 센스 좋은 브랜드”로 인식이 바뀐다.</text>
<line x1="72" y1="569.4" x2="1008" y2="569.4" stroke="#DCE3EB" stroke-width="1"/>
<rect x="72" y="578.5" width="26" height="26.0" rx="6" fill="#3A5A80"/>
<text x="85" y="597.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="110" y="598.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" fill="#3A5A80" text-anchor="start">문구 브랜드 SWOT</text>
<rect x="72.0" y="616.5" width="460.0" height="148.0" rx="14" fill="#E7EEF5" stroke="#DCE3EB" stroke-width="1.5"/>
