<text x="96.0" y="690.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="690.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">2030 여성 팬덤 = 다꾸·텍스트힙 소비층</text>
<text x="96.0" y="715.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="715.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">‘글·말’ 주제 전시 경험(NEW WORDS, NEW WORTH)</text>
<text x="96.0" y="740.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="740.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">옷 외 상품 경험(아이웨어·뷰티 굿즈)</text>
