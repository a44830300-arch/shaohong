<text x="572.0" y="690.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="588.0" y="690.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">문구를 만들고 팔아 본 경험 없음</text>
<text x="572.0" y="715.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="588.0" y="715.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">로고만 찍은 굿즈로 보일 위험</text>
<text x="572.0" y="740.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="588.0" y="740.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">문구는 단가가 낮아 매출이 작음</text>
<rect x="72.0" y="776.5" width="460.0" height="148.0" rx="14" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="1.5"/>
<text x="96.0" y="814.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#3A5A80" text-anchor="start">O</text>
<text x="120.765625" y="814.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">기회</text>
<text x="96.0" y="850.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="850.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">텍스트힙 — 메타 2026 주요 트렌드</text>
<text x="96.0" y="875.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="875.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">비싸도 예쁜 문구 찾는 2030 여성 증가</text>
<text x="96.0" y="900.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
