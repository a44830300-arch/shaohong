<text x="594.375" y="814.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#3A5A80" text-anchor="start">위협</text>
<text x="572.0" y="850.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="588.0" y="850.5" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15.5" font-weight="500" fill="#1F2A37" text-anchor="start">자리 잡은 감성 문구 브랜드 많음(오롤리데이 등)</text>
