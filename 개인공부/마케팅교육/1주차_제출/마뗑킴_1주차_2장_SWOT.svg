<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F4EF"/>
<text x="72" y="70.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="end">2 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#151515" stroke-width="2"/>
<text x="72" y="150.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">04  SWOT</text>
<rect x="72" y="182.0" width="458" height="744.0" rx="14" fill="#E8E2D6" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="100" y="234.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#1F3A5F" text-anchor="start">S</text>
<text x="131.125" y="234.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">강점</text>
<text x="100" y="292.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="292.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">매출이 하락 없이 계속 상승 중</text>
<text x="100" y="350.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="350.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">20대 여성 팬덤이 아주 큼</text>
<text x="100" y="408.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="408.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">마케팅·모델 선택이 좋음(김채원), 남성복 시작</text>
<text x="100" y="466.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="466.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">주력 상품의 가격이 비싸지 않다</text>
<text x="100" y="524.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="524.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">대표는 이미 나갔지만, 대표의 이미지와 성공</text>
<text x="118" y="556.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">신화 덕분에 브랜드 이미지가 좋다</text>
<text x="100" y="614.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="614.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">온라인 팬덤 → 오프라인 확장 후에도 인기 유지</text>
<text x="100" y="672.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="672.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">해외 성공(매장 26개), 협업·예술·공간으로</text>
<text x="118" y="704.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">확장 중</text>
<text x="100" y="762.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="762.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">중화권 진출 준비(중국 1호점 계획)</text>
<rect x="550" y="182.0" width="458" height="744.0" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="578" y="234.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#1F3A5F" text-anchor="start">W</text>
<text x="620.828125" y="234.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">약점</text>
<text x="578" y="292.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="292.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">브랜드 역사가 짧음</text>
<text x="578" y="350.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="350.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">여성적인 이미지가 강함(손님 대부분 여성)</text>
<text x="578" y="408.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="408.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">브랜드 이미지(빅로고)가 조금 물린다</text>
<text x="578" y="466.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="466.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">라이프스타일 확장에 있어 후발주자임</text>
<text x="578" y="524.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="524.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">창업자 대표가 2023년에 나감 → 브랜드</text>
<text x="596" y="556.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">얼굴 부재</text>
<text x="578" y="614.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="614.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">국내 인기가 식는 중, 길에서 점점 안 보임</text>
<text x="578" y="672.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="672.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">오프라인 매출은 내국인보다 외국인이 많음</text>
<rect x="72" y="946.0" width="458" height="324.0" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="100" y="998.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#1F3A5F" text-anchor="start">O</text>
<text x="134.859375" y="998.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">기회</text>
<text x="100" y="1056.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="1056.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">한국 이미지가 좋아져 외국인 관광객이</text>
<text x="118" y="1088.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">계속 늘어남</text>
<text x="100" y="1146.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="118" y="1146.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">요즘은 가격·기능보다 ‘브랜드 이미지’로 산다</text>
<rect x="550" y="946.0" width="458" height="324.0" rx="14" fill="#E8E2D6" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="578" y="998.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="30" font-weight="800" fill="#1F3A5F" text-anchor="start">T</text>
<text x="609.59375" y="998.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">위협</text>
<text x="578" y="1056.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="1056.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">‘3마’로 로고가 비슷함</text>
<text x="578" y="1114.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="596" y="1114.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">패션 브랜드가 모두 ‘탈패션’(카페·뷰티)으로</text>
<text x="596" y="1146.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="500" fill="#151515" text-anchor="start">가는 중</text>
</svg>
