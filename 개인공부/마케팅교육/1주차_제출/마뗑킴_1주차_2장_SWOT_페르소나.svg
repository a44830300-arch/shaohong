<text x="1008" y="70" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="end">2 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#151515" stroke-width="2"/>
<text x="72" y="128" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="start">02  SWOT + 페르소나</text>
<rect x="72.0" y="170" width="458.0" height="300" rx="14" fill="#E8E2D6" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="96.0" y="212" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">S  강점</text>
<text x="96.0" y="252" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="252" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">매출이 하락 없이 계속 상승 중</text>
<text x="96.0" y="279.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="279.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">20대 여성 팬덤이 아주 큼</text>
<text x="96.0" y="307.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="307.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">마케팅·모델 선택이 좋음(김채원), 남성복 시작</text>
<text x="96.0" y="335.40000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="335.40000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">주력 상품의 가격이 비싸지 않다</text>
<text x="96.0" y="363.20000000000005" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="363.20000000000005" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">대표는 이미 나갔지만, 대표의 이미지와 성공 신화</text>
<text x="114.0" y="387.00000000000006" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">덕분에 브랜드 이미지가 좋다</text>
<text x="96.0" y="414.80000000000007" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="414.80000000000007" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">온라인 팬덤 → 오프라인 확장 후에도 인기 유지</text>
<text x="96.0" y="442.6000000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="442.6000000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">해외 성공(매장 26개), 협업·예술·공간으로 확장 중</text>
<text x="96.0" y="470.4000000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="470.4000000000001" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">중화권 진출 준비(중국 1호점 계획)</text>
<rect x="550.0" y="170" width="458.0" height="300" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="574.0" y="212" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">W  약점</text>
<text x="574.0" y="252" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="252" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">브랜드 역사가 짧음</text>
<text x="574.0" y="279.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="279.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">여성적인 이미지가 강함(손님 대부분 여성)</text>
<text x="574.0" y="307.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="307.6" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">브랜드 이미지(빅로고)가 조금 물린다</text>
<text x="574.0" y="335.40000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="335.40000000000003" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">라이프스타일 확장에 있어 후발주자임</text>
<text x="574.0" y="363.20000000000005" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="363.20000000000005" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">창업자 대표가 2023년에 나감 → 브랜드 얼굴 부재</text>
<text x="574.0" y="391.00000000000006" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="391.00000000000006" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">국내 인기가 식는 중, 길에서 점점 안 보임</text>
<text x="574.0" y="418.80000000000007" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="418.80000000000007" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">오프라인 매출은 내국인보다 외국인이 많음</text>
<rect x="72.0" y="490" width="458.0" height="300" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="96.0" y="532" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">O  기회</text>
<text x="96.0" y="572" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="572" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">한국 이미지가 좋아져 외국인 관광객이 계속 늘어남</text>
<text x="96.0" y="599.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="599.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">환율이 떨어져 관광객 쇼핑에 유리</text>
<text x="96.0" y="627.5999999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="114.0" y="627.5999999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">요즘은 가격·기능보다 ‘브랜드 이미지’로 산다</text>
<rect x="550.0" y="490" width="458.0" height="300" rx="14" fill="#E8E2D6" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="574.0" y="532" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">T  위협</text>
<text x="574.0" y="572" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="572" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">패션 브랜드끼리 ‘3마’로 많이 엮이는데, 좋은 현상은</text>
<text x="592.0" y="595.8" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">아닌 것 같다</text>
<text x="574.0" y="623.5999999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#151515" text-anchor="start">·</text>
<text x="592.0" y="623.5999999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#151515" text-anchor="start">패션 브랜드가 모두 ‘탈패션’(카페·뷰티)으로 가는 중</text>
<text x="72" y="830" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="24" font-weight="800" fill="#151515" text-anchor="start">페르소나 1명</text>
<rect x="72" y="854" width="936" height="240" rx="14" fill="#151515"/>
<text x="102" y="904" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="start">강정준 · 30세 남성 · 직장인</text>
<text x="102" y="946" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#EDEDED" text-anchor="start">옷에 관심이 많고 여러 브랜드를 경험해 보는 걸 좋아한다. 마뗑킴을 알지만 로고에서 느껴지는 여성스러움 때문에</text>
<text x="102" y="973.55" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#EDEDED" text-anchor="start">아직 한 번도 못 사 봤다. 남의 눈치를 보는 편이고, ‘3마’가 뭐가 다른지 잘 모른다.</text>
<text x="102" y="1009.0999999999999" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="600" fill="#BFD0E6" text-anchor="start">여자친구(32세 직장인)는 마뗑킴 손님. 남자친구 옷차림을 무난하게 챙겨 주는 편 → 구매를 도와주는 사람.</text>
<text x="72" y="1134" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">왜 이 사람? WHY(여성 → 남성·중성 이미지)에 딱 맞고, 여자친구라는 ‘이미 있는 팬’을 통해 다가갈 수 있다.</text>
</svg>
