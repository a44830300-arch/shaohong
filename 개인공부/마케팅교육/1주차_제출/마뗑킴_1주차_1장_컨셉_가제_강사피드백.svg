<svg width="1690" height="1013" viewBox="0 0 1690 1013" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1690" height="1013" fill="#FFFFFF"/>
<g id="1/3 캠페인 컨셉 · 가제">
<rect width="810" height="1013" fill="#F7F8FA"/>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="54" y="53.8">MATIN KIM 2팀 · 1주차 분석 및 방향</tspan></text>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="732" y="53.8">1 / 3</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="bold"><tspan x="54" y="107.5">캠페인 컨셉 · 가제</tspan></text>
<rect x="54" y="133" width="702" height="832" rx="12" fill="#36577C"/>
<text fill="#C9D7E8" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="500"><tspan x="102" y="385.5">캠페인 컨셉</tspan></text>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="32" font-weight="bold"><tspan x="102" y="440.3">지금까지는 ‘옷 입은’ 마뗑킴,&#10;</tspan><tspan x="102" y="485.3">이제는 ‘쓰기도’ 한다</tspan></text>
<rect x="102" y="545" width="606" height="1" fill="#6E88A6"/>
<text fill="#C9D7E8" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="500"><tspan x="102" y="613.5">가제</tspan></text>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="40" font-weight="bold"><tspan x="102" y="679">마뗑킴, 쓰다</tspan></text>
<text fill="#C3D3E6" xml:space="preserve" font-family="Noto Sans KR" font-size="19" font-weight="bold"><tspan x="102" y="726.1">MATIN KIM WRITES</tspan></text>
</g>
<g id="강사 피드백 — 1/3 (미적용)" transform="translate(870 0)">
<rect x="0.75" y="0.75" width="818.5" height="636.5" rx="13.25" fill="#FFF6D6"/>
<rect x="0.75" y="0.75" width="818.5" height="636.5" rx="13.25" stroke="#EBCF7A" stroke-width="1.5"/>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="22" font-weight="bold"><tspan x="33.5" y="58.8">강사 피드백 · 1/3 캠페인 컨셉·가제</tspan></text>
<text fill="#8A6D1F" xml:space="preserve" font-family="Noto Sans KR" font-size="13" font-weight="500"><tspan x="33.5" y="95.7">강사님 피드백 원문 정리(2026-11-12)예요. 왼쪽 본문에는 아직 적용하지 않았어요.</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="142.9">컨셉 — 고객의 &#34;어떤 순간&#34;을 책임지나?</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="169.9">•  한 문장으로 쓰기. ‘감성 문구’처럼 아무 데나 붙는 말은 금지</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="195.9">•  ‘쓰다’를 골랐으면 언제·어디서·뭘 쓰는지 장면 하나로 좁히기</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="242.9">브랜드명</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="269.9">•  마뗑킴 이름 그대로 vs 새 이름 — 후보 2~3개 + 고른 이유</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="316.9">슬로건</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="343.9">•  국문 + 영문 둘 다 (매장 손님 대부분이 외국인 → 영문 필수)</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="390.9">이미지</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="417.9">•  본 브랜드와 같이 갈 것 / 다르게 갈 것</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="443.9">•  키워드 3개, 컬러·로고 방향, 무드보드 1장</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="490.9">강사 예시 (구체성 참고용 — 그대로 쓰지 말 것)</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="517.9">•  컨셉: matin = 프랑스어 ‘아침’ → ‘아침에 쓰는 한 페이지’ (텍스트힙·모닝페이지 트렌드)</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="543.9">•  브랜드명: MATIN PAGES (후보: 마뗑 노트, KIM&#39;S DESK) → 처음엔 ‘MATIN PAGES by MATIN KIM’</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="569.9">•  슬로건: 하루의 첫 페이지 / Write your matin.</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="595.9">•  이미지: 아침 햇빛·여백·손글씨, 빅로고 대신 작은 각인 + 한글 ‘마뗑’ 로고, 크림색 종이 + 검정 포인트</tspan></text>
</g>
</svg>
