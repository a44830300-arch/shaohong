<text x="588.0" y="646.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#1F2A37" text-anchor="start">브랜드 이미지(빅로고)가 조금 물린다</text>
<text x="572.0" y="688.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
