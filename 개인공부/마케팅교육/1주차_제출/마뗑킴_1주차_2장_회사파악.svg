<text x="96.0" y="646.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="646.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#1F2A37" text-anchor="start">마케팅·모델 선택이 좋음(김채원), 남성복 시작</text>
<text x="96.0" y="688.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="688.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#1F2A37" text-anchor="start">주력 상품의 가격이 비싸지 않다</text>
<text x="96.0" y="730.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="730.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#1F2A37" text-anchor="start">대표는 이미 나갔지만, 대표의 이미지와 성공 신화</text>
<text x="112.0" y="758.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#1F2A37" text-anchor="start">덕분에 브랜드 이미지가 좋다</text>
<text x="96.0" y="800.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
<text x="112.0" y="800.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#1F2A37" text-anchor="start">온라인 팬덤 → 오프라인 확장 후에도 인기 유지</text>
