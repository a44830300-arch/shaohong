<text x="112.0" y="842.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="500" fill="#1F2A37" text-anchor="start">해외 성공(매장 26개), 협업·예술·공간으로 확장 중</text>
<text x="96.0" y="884.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F2A37" text-anchor="start">·</text>
