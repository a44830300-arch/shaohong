<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F4EF"/>
<text x="72" y="70.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="start">MATIN KIM 2팀 · 1주차 분석 및 방향</text>
<text x="1008" y="70.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="600" fill="#6B6B6B" text-anchor="end">1 / 3</text>
<line x1="72" y1="88" x2="1008" y2="88" stroke="#151515" stroke-width="2"/>
<text x="72" y="150.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">01  브랜드 현황</text>
<text x="72" y="238.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start">주력 상품</text>
<text x="262" y="238.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#151515" text-anchor="start">가방 · 지갑 · 빅로고 티</text>
<line x1="72" y1="268.0" x2="1008" y2="268.0" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="322.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start">주요 채널</text>
<text x="262" y="322.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#151515" text-anchor="start">인스타그램</text>
<line x1="72" y1="352.0" x2="1008" y2="352.0" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="406.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1F3A5F" text-anchor="start">최근 캠페인</text>
<text x="262" y="406.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#151515" text-anchor="start">2026 앰버서더 5명 — 리즈(봄) · 제노(여름, 첫 남성) · 모모(가을, 남녀 공용) ·</text>
<text x="262" y="440.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#151515" text-anchor="start">리노(FW) · 김채원(겨울 ‘The New Wind’)</text>
<line x1="72" y1="470.0" x2="1008" y2="470.0" stroke="#D9D5CC" stroke-width="1"/>
<text x="72" y="554.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">02  경쟁사 2곳</text>
<rect x="72" y="582.0" width="456" height="300.0" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="104" y="636.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">지금의 패션 경쟁자</text>
<text x="104" y="686.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800" fill="#151515" text-anchor="start">마리떼 프랑소와 저버</text>
<line x1="104" y1="722" x2="496" y2="722" stroke="#D9D5CC" stroke-width="1"/>
<text x="104" y="768.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="500" fill="#151515" text-anchor="start">패션 쪽에서 마뗑킴과 같이 엮이는데, 이미 먼저</text>
<text x="104" y="800.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="500" fill="#151515" text-anchor="start">브랜드 확장을 적극적으로 하고 있다.</text>
<rect x="552" y="582.0" width="456" height="300.0" rx="14" fill="#FFFFFF" stroke="#D9D5CC" stroke-width="1.5"/>
<text x="584" y="636.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">앞으로의 라이프스타일 경쟁자</text>
<text x="584" y="686.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="800" fill="#151515" text-anchor="start">젠틀몬스터</text>
<text x="732.28125" y="686.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="start">(누데이크 · 탬버린즈)</text>
<line x1="584" y1="722" x2="976" y2="722" stroke="#D9D5CC" stroke-width="1"/>
<text x="584" y="768.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="500" fill="#151515" text-anchor="start">마뗑킴이 추구하는 이미지를 젠틀몬스터가 이미</text>
<text x="584" y="800.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="20" font-weight="500" fill="#151515" text-anchor="start">선점하고 있다.</text>
<text x="72" y="966.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#1F3A5F" text-anchor="start">03  페르소나 1명</text>
<rect x="72" y="994.0" width="936" height="276.0" rx="14" fill="#151515"/>
<text x="112" y="1113.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">강정준 · 28세 여성 · 직장 2년 차</text>
<text x="112" y="1173.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="23" font-weight="500" fill="#EDEDED" text-anchor="start">옷에 관심이 많다. SNS 활동을 자주 하고,</text>
<text x="112" y="1209.0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="23" font-weight="500" fill="#EDEDED" text-anchor="start">본인의 것을 보여 주는 걸 좋아한다.</text>
</svg>
