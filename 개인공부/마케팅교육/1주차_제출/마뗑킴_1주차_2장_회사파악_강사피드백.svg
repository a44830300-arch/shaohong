<svg width="1690" height="1013" viewBox="0 0 1690 1013" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1690" height="1013" fill="#FFFFFF"/>
<g id="2/3 회사 파악">
<rect width="810" height="1013" fill="#F7F8FA"/>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="54" y="53.8">MATIN KIM 2팀 · 1주차 분석 및 방향</tspan></text>
<text fill="#6B7684" xml:space="preserve" font-family="Noto Sans KR" font-size="12" font-weight="500"><tspan x="732" y="53.8">2 / 3</tspan></text>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="22" font-weight="bold"><tspan x="54" y="111.3">회사 파악</tspan></text>
<rect x="54" y="136.5" width="20" height="20" rx="4" fill="#36577C"/>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="60.5" y="150.9">1</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="bold"><tspan x="82" y="152.5">브랜드 현황</tspan></text>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="13" font-weight="bold"><tspan x="54" y="199.2">주력 상품</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="13"><tspan x="180" y="199.2">가방 · 지갑 · 빅로고 티</tspan></text>
<rect x="54" y="216" width="702" height="1" fill="#DDE3EA"/>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="13" font-weight="bold"><tspan x="54" y="240.2">주요 채널</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="13"><tspan x="180" y="240.2">인스타그램</tspan></text>
<rect x="54" y="257" width="702" height="1" fill="#DDE3EA"/>
<text fill="#1F2A37" xml:space="preserve" font-family="Noto Sans KR" font-size="13" font-weight="bold"><tspan x="54" y="281.2">최근 캠페인</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="13"><tspan x="180" y="281.2">2026 앰버서더 5명 — 리즈(봄) · 제노(여름, 첫 남성) · 모모(가을, 남녀 공용) · 리노(FW) · 김채원(겨울 </tspan><tspan x="180" y="301.2">‘The New Wind’)</tspan></text>
<rect x="54" y="316" width="702" height="1" fill="#DDE3EA"/>
<rect x="54" y="346.5" width="20" height="20" rx="4" fill="#36577C"/>
<text fill="white" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="60.5" y="360.9">2</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="15" font-weight="bold"><tspan x="82" y="362.5">SWOT</tspan></text>
<rect x="54.5" y="378.5" width="344" height="309" rx="9.5" fill="#E6EDF5"/>
<rect x="54.5" y="378.5" width="344" height="309" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="73" y="413.4">S</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="89" y="411.4">강점</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="439.5">·  매출이 하락 없이 계속 상승 중</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="464.5">·  20대 여성 팬덤이 아주 큼</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="489.5">·  마케팅·모델 선택이 좋음(김채원), 남성복 시작</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="514.5">·  주력 상품의 가격이 비싸지 않다</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="539.5">·  대표는 이미 나갔지만, 대표의 이미지와 성공 신화 덕분에 </tspan><tspan x="73" y="558.5">브랜드 이미지가 좋다</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="583.5">·  온라인 팬덤 → 오프라인 확장 후에도 인기 유지</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="608.5">·  해외 성공(매장 26개), 협업·예술·공간으로 확장 중</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="633.5">·  중화권 진출 준비(중국 1호점 계획)</tspan></text>
<rect x="411.5" y="378.5" width="344" height="309" rx="9.5" fill="white"/>
<rect x="411.5" y="378.5" width="344" height="309" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="430" y="413.4">W</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="451" y="411.4">약점</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="430" y="439.5">·  브랜드 역사가 짧음</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="430" y="464.5">·  여성적인 이미지가 강함(손님 대부분 여성)</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="430" y="489.5">·  브랜드 이미지(빅로고)가 조금 물린다</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="430" y="514.5">·  라이프스타일 확장에 있어 후발주자임</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="430" y="539.5">·  창업자 대표가 2023년에 나감 → 브랜드 얼굴 부재</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="430" y="564.5">·  국내 인기가 식는 중, 길에서 점점 안 보임</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="430" y="589.5">·  오프라인 매출은 내국인보다 외국인이 많음</tspan></text>
<rect x="54.5" y="698.5" width="344" height="199" rx="9.5" fill="white"/>
<rect x="54.5" y="698.5" width="344" height="199" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="73" y="733.4">O</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="92" y="731.4">기회</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="759.5">·  한국 이미지가 좋아져 외국인 관광객이 계속 늘어남</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="784.5">·  국내외 여행객이 계속 증가하고 있음</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="73" y="809.5">·  요즘은 가격·기능보다 ‘브랜드 이미지’로 산다</tspan></text>
<rect x="411.5" y="698.5" width="344" height="199" rx="9.5" fill="#E6EDF5"/>
<rect x="411.5" y="698.5" width="344" height="199" rx="9.5" stroke="#DDE3EA"/>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="430" y="733.4">T</tspan></text>
<text fill="#36577C" xml:space="preserve" font-family="Noto Sans KR" font-size="11" font-weight="bold"><tspan x="446" y="731.4">위협</tspan></text>
<text fill="#3A4553" xml:space="preserve" font-family="Noto Sans KR" font-size="12.5"><tspan x="430" y="759.5">·  ‘3마’로 로고가 비슷함</tspan></text>
</g>
<g id="강사 피드백 — 2/3 (미적용)" transform="translate(870 0)">
<rect x="0.75" y="0.75" width="818.5" height="696.5" rx="13.25" fill="#FFF6D6"/>
<rect x="0.75" y="0.75" width="818.5" height="696.5" rx="13.25" stroke="#EBCF7A" stroke-width="1.5"/>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="22" font-weight="bold"><tspan x="33.5" y="58.8">강사 피드백 · 2/3 회사 파악 (브랜드 현황·SWOT)</tspan></text>
<text fill="#8A6D1F" xml:space="preserve" font-family="Noto Sans KR" font-size="13" font-weight="500"><tspan x="33.5" y="95.7">강사님 피드백 원문 정리(2026-11-12)예요. 왼쪽 본문에는 아직 적용하지 않았어요.</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="142.9">① 숫자·근거가 거의 없다</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="169.9">•  ‘매출 계속 상승’, ‘국내 인기 식는 중’, ‘길에서 점점 안 보임’처럼 느낌으로 쓴 문장에 숫자 붙이기</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="195.9">•  SWOT 항목마다 근거 한 줄 + 출처 붙이기</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="221.9">•  근거를 못 찾은 항목은 빼거나, 검색량 추이처럼 확인 가능한 지표로 바꾸기</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="268.9">강사가 예로 준 숫자 (기사에서 바로 찾을 수 있는 것)</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="295.9">•  연매출: 2020년 약 50억 → 2024년 1,500억 → 2025년 2,000억 규모 (뉴스1, 머니투데이)</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="321.9">•  성장 배경: 2021년 하고하우스 투자 이후 백화점 입점으로 성장</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="347.9">•  매장 고객: 성수·명동 등 관광 상권 매장은 방문객 90% 이상이 해외 고객, ‘서울 익스클루시브’ 제품 인기 (머니투데이, 2025.12)</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="373.9">•  해외: 홍콩·대만·마카오·일본·태국·불가리아·몽골 진출, 태국 센트럴그룹과 5년 600억 유통 계약</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="399.9">•  잡화 역량: 카드지갑·캔버스백으로 2025 APEC 공식 협찬, 코치·케이스티파이 협업</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="425.9">•  그룹 차원: 하고하우스 ‘모자이크 한남’ 오픈, 커피 브랜드까지 입점 → 이미 라이프스타일로 움직이는 증거</tspan></text>
<text fill="#5C4300" xml:space="preserve" font-family="Noto Sans KR" font-size="16" font-weight="bold"><tspan x="33.5" y="472.9">② SWOT 앞뒤가 안 맞는 부분</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="499.9">•  ‘매출 계속 상승’과 ‘국내 인기 식는 중’을 숫자로 나누기</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="525.9">    – 예: 해외·관광객 매출은 큼 / 국내 2030 체감 인기는 정체 + 사례·데이터</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="551.9">•  ‘외국인 매출이 더 많다’는 약점이 아니라 기회 쪽으로 다시 보기</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="577.9">    – 매장 손님 90%가 외국인 = 가장 큰 기회. ‘여행 노트’를 관광객에게 팔 곳이 이미 있다</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="603.9">•  위협이 ‘3마와 로고 비슷’ 한 줄뿐 → 문구 사업 자체의 위협 추가: 가격 경쟁, 재고 부담, 패션 브랜드 굿즈 피로감</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="629.9">•  강점·약점에 같은 내용이 겹치지 않게</tspan></text>
<text fill="#3D3420" xml:space="preserve" font-family="Noto Sans KR" font-size="13.5"><tspan x="33.5" y="655.9">•  SO / WO / ST / WT 전략을 한 줄씩 뽑고, 캠페인 방향이 그중 하나에서 나오게</tspan></text>
</g>
</svg>
